<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cross P2P</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --ink:#0B1220; --paper:#F3F5F9; --card:#fff; --line:#E2E7EF; --line-2:#EEF1F6;
  --text:#142033; --muted:#5D6B83; --faint:#8C98AD;
  --cobalt:#2340E8; --cobalt-dk:#1A31BD; --cobalt-soft:#E8ECFF;
  --buy:#0E9F6E; --buy-dk:#0B805A; --buy-soft:#E1F5EC;
  --sell:#C46108; --sell-soft:#FCEEDB;
  --danger:#D13B3B; --danger-soft:#FCE8E8;
  --display:"Bricolage Grotesque","Plus Jakarta Sans",system-ui,sans-serif;
  --body:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
body{font-family:var(--body);font-size:15px;line-height:1.55;color:var(--text);min-height:100vh;font-variant-numeric:tabular-nums;
  background:radial-gradient(800px 420px at 90% -10%,#DCE3FF 0%,transparent 62%),radial-gradient(600px 360px at -8% 10%,#E3F3EC 0%,transparent 60%),var(--paper)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:inherit}
.ic{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ic.sm{width:16px;height:16px}
:focus-visible{outline:3px solid #7C91FF;outline-offset:2px;border-radius:6px}
.wrap{width:min(760px,100% - 28px);margin-inline:auto}

/* header */
.top{position:sticky;top:0;z-index:20;background:rgba(243,245,249,.82);backdrop-filter:blur(14px);border-bottom:1px solid rgba(226,231,239,.9)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;height:60px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:-.02em}
.brand-mark{width:34px;height:34px;border-radius:10px;background:linear-gradient(145deg,#2F4DFF,#1A2FB5);color:#fff;display:grid;place-items:center;box-shadow:0 6px 14px -4px rgba(35,64,232,.55),inset 0 1px 0 rgba(255,255,255,.28)}
.brand-mark .ic{width:19px;height:19px;stroke-width:2.1}
.deskbtn{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 14px;border-radius:11px;background:var(--ink);color:#fff;font-weight:700;font-size:13.5px}
.deskbtn .badge{min-width:20px;height:20px;padding:0 6px;border-radius:99px;background:#FFB84D;color:#2A1A00;font-size:12px;font-weight:800;display:grid;place-items:center}
.backbtn{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 12px;border-radius:11px;background:#fff;border:1px solid var(--line);font-weight:700;font-size:13.5px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;height:46px;padding:0 20px;border-radius:12px;font-weight:700;font-size:14.5px;transition:transform .12s,background .15s;white-space:nowrap}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-block{width:100%}
.btn-primary{background:var(--cobalt);color:#fff;box-shadow:0 8px 18px -8px rgba(35,64,232,.7),inset 0 1px 0 rgba(255,255,255,.2)}
.btn-primary:hover:not(:disabled){background:var(--cobalt-dk)}
.btn-buy{background:var(--buy);color:#fff;box-shadow:0 8px 16px -9px rgba(14,159,110,.8),inset 0 1px 0 rgba(255,255,255,.2)}
.btn-buy:hover:not(:disabled){background:var(--buy-dk)}
.btn-sell{background:#fff;color:var(--sell);border:1.5px solid #E7B987}
.btn-sell:hover:not(:disabled){background:var(--sell-soft)}
.btn-sell.solid{background:var(--sell);color:#fff;border-color:var(--sell)}
.btn-ghost{background:#fff;border:1px solid var(--line)}
.btn-danger{background:var(--danger-soft);color:var(--danger)}
.btn.sm{height:38px;padding:0 15px;font-size:13.5px;border-radius:10px}
.icon-btn{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;color:var(--muted)}
.icon-btn:hover{background:#EAEEF6;color:var(--text)}

/* hero + best rates */
.intro{padding:30px 0 6px}
.intro h1{font-family:var(--display);font-weight:700;font-size:clamp(30px,8vw,42px);line-height:1.04;letter-spacing:-.035em}
.intro p{margin-top:10px;color:var(--muted);max-width:30em}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.best{animation:rise .6s cubic-bezier(.2,.7,.2,1) both}
.best{position:relative;isolation:isolate;overflow:hidden;margin-top:22px;border-radius:24px;color:#fff;padding:22px;display:grid;grid-template-columns:1fr 1fr;gap:18px;
  background:linear-gradient(160deg,#16213A 0%,#0B1220 70%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.09),0 34px 60px -28px rgba(11,18,32,.6),0 14px 26px -18px rgba(35,64,232,.5)}
.best::before{content:"";position:absolute;inset:0;z-index:-1;background:repeating-linear-gradient(135deg,rgba(255,255,255,.038) 0 1px,transparent 1px 16px),repeating-linear-gradient(45deg,rgba(255,255,255,.038) 0 1px,transparent 1px 16px);mask-image:linear-gradient(180deg,#000,transparent 90%);-webkit-mask-image:linear-gradient(180deg,#000,transparent 90%)}
.best::after{content:"";position:absolute;width:260px;height:260px;right:-90px;top:-110px;z-index:-1;border-radius:50%;background:radial-gradient(circle,rgba(70,100,255,.5),transparent 68%)}
.best .k{font-size:12.5px;font-weight:600;color:rgba(255,255,255,.68)}
.best .n{font-family:var(--display);font-weight:700;font-size:clamp(28px,8vw,40px);letter-spacing:-.03em;line-height:1.1;margin-top:4px}
.best .n small{font-family:var(--body);font-size:13px;font-weight:600;color:rgba(255,255,255,.55);margin-left:6px;letter-spacing:0}
.best .who{margin-top:4px;font-size:13px;font-weight:600;color:rgba(255,255,255,.82)}
.best .buyc .n{color:#6EE7B7}
.best .sellc .n{color:#FFC27A}
.notice{margin-top:16px;display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;background:#fff;border:1px solid var(--line);font-size:13.5px;color:var(--muted)}
.notice .ic{color:var(--cobalt);margin-top:2px}

/* platform list */
.sect{margin:26px 0 12px;font-family:var(--display);font-size:20px;font-weight:650;letter-spacing:-.02em}
.market{background:var(--card);border:1px solid var(--line);border-radius:22px;overflow:hidden;margin-bottom:40px}
.mrow{display:grid;grid-template-columns:1fr 1fr;gap:16px 18px;padding:20px}
.mrow+.mrow{border-top:1px solid var(--line-2)}
.mrow[data-paused="true"]{opacity:.6}
.ident{grid-column:1/-1;display:flex;align-items:center;gap:13px;min-width:0}
.av{width:44px;height:44px;border-radius:13px;flex:none;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:15px;background:hsl(var(--h) 75% 93%);color:hsl(var(--h) 55% 30%);border:1px solid hsl(var(--h) 55% 86%)}
.ident-text{min-width:0;flex:1}
.ident-text strong{display:flex;align-items:center;gap:9px;font-size:16.5px;font-family:var(--display);font-weight:650;letter-spacing:-.01em}
.pill{display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:99px;font-size:11.5px;font-weight:700;background:var(--buy-soft);color:var(--buy-dk)}
.pill.blue{background:var(--cobalt-soft);color:var(--cobalt)}
.tg{display:inline-flex;align-items:center;gap:6px;margin-top:4px;max-width:100%;padding:3px 10px 3px 8px;border-radius:99px;background:var(--cobalt-soft);color:var(--cobalt);font-size:12.5px;font-weight:600;text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rate .k{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;color:var(--muted)}
.rate .n{font-family:var(--display);font-size:27px;font-weight:700;letter-spacing:-.025em;line-height:1.15}
.rate .n small{font-family:var(--body);font-size:12px;font-weight:600;color:var(--faint);letter-spacing:0;margin-left:4px}
.rate.buy .n{color:var(--buy-dk)}.rate.sell .n{color:var(--sell)}
.macts{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.empty{padding:50px 24px;text-align:center;color:var(--muted)}
.empty strong{display:block;color:var(--text);font-size:16px;margin-bottom:4px}
.skeleton{height:92px;margin:14px 20px;border-radius:14px;background:linear-gradient(90deg,#EEF1F6,#F7F9FC,#EEF1F6);background-size:200% 100%;animation:shine 1.3s infinite linear}
@keyframes shine{to{background-position:-200% 0}}

/* sheet */
dialog{border:0;padding:0;color:var(--text);background:var(--card);font-family:var(--body)}
dialog::backdrop{background:rgba(11,18,32,.56);backdrop-filter:blur(3px)}
@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.sheet{margin:auto 0 0;width:100%;max-width:none;max-height:94dvh;border-radius:26px 26px 0 0;box-shadow:0 -30px 60px -30px rgba(11,18,32,.45)}
.sheet[open]{display:flex;flex-direction:column;animation:up .3s cubic-bezier(.2,.8,.2,1)}
.sh-head{display:flex;align-items:center;gap:13px;padding:18px 20px;border-bottom:1px solid var(--line-2)}
.sh-head h2{font-family:var(--display);font-size:19px;letter-spacing:-.02em;line-height:1.2}
.sh-form{flex:1;min-height:0;display:flex;flex-direction:column}
.sh-body{flex:1;overflow:auto;padding:20px 20px 6px}
.sh-foot{padding:14px 20px calc(18px + env(safe-area-inset-bottom));border-top:1px solid var(--line-2)}
.foot-total{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
.foot-total span{color:var(--muted);font-weight:600;font-size:14px}
.foot-total strong{font-family:var(--display);font-size:23px;letter-spacing:-.02em}
.err{margin-bottom:12px;padding:10px 14px;border-radius:10px;background:var(--danger-soft);color:#A52A2A;font-size:13.5px;font-weight:600}
.seg{position:relative;display:grid;grid-template-columns:1fr 1fr;padding:4px;border-radius:14px;background:#EDF0F6;margin-bottom:20px}
.seg .thumb{position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);border-radius:10px;background:#fff;box-shadow:0 3px 8px -3px rgba(11,18,32,.35);transition:transform .28s cubic-bezier(.3,.8,.3,1)}
.seg[data-mode="sell"] .thumb{transform:translateX(100%)}
.seg button{position:relative;z-index:1;height:40px;border-radius:10px;font-weight:700;font-size:14px;color:var(--muted)}
.seg button[aria-selected="true"]{color:var(--ink)}
.field{margin-top:16px}.field:first-child{margin-top:0}
.field>label{display:block;font-size:13.5px;font-weight:700;margin-bottom:7px}
.field .hint{font-size:12.5px;color:var(--muted);margin-top:6px}
.field input[type=text],.field input[type=number],.field input[type=tel]{width:100%;height:48px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:#fff;outline:0;font-size:16px;transition:border-color .15s,box-shadow .15s}
.field input:focus{border-color:var(--cobalt);box-shadow:0 0 0 4px rgba(35,64,232,.12)}
.field input[aria-invalid="true"]{border-color:var(--danger);box-shadow:0 0 0 4px rgba(209,59,59,.1)}
.inwrap{position:relative}
.inwrap .suffix{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-size:13px;font-weight:700;color:var(--faint);pointer-events:none}
.chips{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.chip{height:32px;padding:0 13px;border-radius:99px;border:1px solid var(--line);background:#fff;font-size:13px;font-weight:600;color:var(--muted)}
.chip:active{background:var(--cobalt-soft);color:var(--cobalt)}
.ssect{margin:24px 0 10px;font-family:var(--display);font-size:16px;font-weight:650;letter-spacing:-.01em}
.ssect:first-child{margin-top:0}
.pay{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#fff;margin-bottom:12px}
.pay-head{display:flex;align-items:center;gap:10px;padding:10px 16px;background:#F7F9FC;border-bottom:1px solid var(--line-2);font-weight:700;font-size:13.5px}
.logo-chip{height:24px;min-width:34px;padding:0 7px;border-radius:7px;display:grid;place-items:center;font-size:11px;font-weight:800;color:#fff}
.logo-chip.tb{background:#1E8E3E}.logo-chip.cbe{background:#7A1F5C}.logo-chip.bn{background:#E0A800;color:#241A00}
.copyrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px}
.copyrow+.copyrow{border-top:1px solid var(--line-2)}
.copyrow .k{display:block;font-size:12px;font-weight:600;color:var(--muted)}
.copyrow .v{display:block;font-size:17px;font-weight:700;letter-spacing:.01em;word-break:break-all}
.copy{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 13px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:13px;font-weight:700;color:var(--cobalt);flex:none;transition:all .15s}
.copy.copied{background:var(--buy-soft);border-color:#B8E5D1;color:var(--buy-dk)}
.copy.xs{height:28px;padding:0 9px;font-size:12px;border-radius:8px}
.drop{display:flex;flex-direction:column;align-items:center;gap:6px;padding:24px 16px;text-align:center;border:1.5px dashed #C3CCDC;border-radius:16px;background:#FAFBFD;cursor:pointer;color:var(--muted)}
.drop strong{color:var(--text);font-size:14px}.drop .ic{width:26px;height:26px}
.drop input{position:absolute;width:1px;height:1px;opacity:0}
.proof-ok{display:flex;align-items:center;gap:14px;padding:12px;border:1px solid var(--line);border-radius:16px}
.proof-ok img{width:64px;height:64px;border-radius:10px;object-fit:cover;border:1px solid var(--line)}
.proof-ok div{flex:1;min-width:0}.proof-ok strong{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.proof-ok span{font-size:12.5px;color:var(--muted)}
.done{padding:38px 22px calc(26px + env(safe-area-inset-bottom));text-align:center;overflow:auto}
.done .badge{width:80px;height:80px;margin:0 auto 20px;display:block}
.done .badge circle{fill:var(--buy-soft);stroke:var(--buy);stroke-width:2.5;stroke-dasharray:240;stroke-dashoffset:240;animation:draw .6s .1s ease forwards}
.done .badge path{fill:none;stroke:var(--buy-dk);stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:44;stroke-dashoffset:44;animation:draw .4s .55s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.done h2{font-family:var(--display);font-size:25px;letter-spacing:-.02em}
.done p{color:var(--muted);margin:8px auto 20px;max-width:28em}
.done .pay{text-align:left}.done .btn+.btn{margin-top:10px}
.loadbox{padding:46px 20px;text-align:center;color:var(--muted)}

/* toast */
.toasts{position:fixed;z-index:100;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translateX(-50%);display:grid;gap:8px;justify-items:center;pointer-events:none;width:max-content;max-width:calc(100% - 28px)}
.toast{display:flex;align-items:center;gap:10px;padding:11px 16px 11px 13px;border-radius:12px;background:var(--ink);color:#fff;font-weight:600;font-size:14px;box-shadow:0 18px 30px -12px rgba(11,18,32,.6);animation:up .25s ease both}
.toast .ic{color:#6EE7B7}.toast.error .ic{color:#FCA5A5}
.toast.out{opacity:0;transition:opacity .25s}

/* desk admin */
.desk{padding:22px 0 60px}
.desk h1{font-family:var(--display);font-size:28px;letter-spacing:-.03em;line-height:1.1}
.desk .sub{color:var(--muted);margin:6px 0 18px}
.tabs{display:inline-flex;padding:4px;border-radius:12px;background:#E6EAF2;gap:2px;margin-bottom:14px;max-width:100%}
.tabs button{height:36px;padding:0 16px;border-radius:9px;font-weight:700;font-size:13.5px;color:var(--muted);display:inline-flex;align-items:center;gap:8px}
.tabs button[aria-pressed="true"]{background:#fff;color:var(--text);box-shadow:0 1px 3px rgba(11,18,32,.12)}
.tabs .n{min-width:20px;height:20px;padding:0 6px;border-radius:99px;background:var(--cobalt);color:#fff;font-size:12px;display:grid;place-items:center}
.list{display:grid;gap:12px}
.ord{position:relative;background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px 16px 16px 20px;overflow:hidden}
.ord::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--faint)}
.ord[data-status="pending"]::before{background:#E5A100}.ord[data-status="approved"]::before{background:var(--buy)}.ord[data-status="rejected"]::before{background:var(--danger)}
.ord-head{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:12px}
.ord-head strong{font-family:var(--display);font-size:16px}
.tag{display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:7px;font-size:12px;font-weight:700}
.tag.buy{background:var(--buy-soft);color:var(--buy-dk)}.tag.sell{background:var(--sell-soft);color:var(--sell)}
.st{font-size:12.5px;font-weight:700}.st.pending{color:#A87500}.st.approved{color:var(--buy-dk)}.st.rejected{color:var(--danger)}
.ord-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px}
.ord-grid .k{display:block;font-size:12px;font-weight:600;color:var(--muted)}
.ord-grid .v{display:block;font-weight:700;word-break:break-word}
.ord-grid .full{grid-column:1/-1}
.ord-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:14px}
.thumb-btn{width:76px;height:76px;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:#F3F5F9;display:grid;place-items:center;color:var(--faint)}
.thumb-btn img{width:100%;height:100%;object-fit:cover}
.ord-acts{display:flex;gap:8px}
.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:14px}
.panel h3{font-family:var(--display);font-size:18px;letter-spacing:-.01em}
.panel .row{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.switchrow{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:16px;padding:12px 14px;border-radius:12px;background:#F7F9FC;border:1px solid var(--line-2);font-weight:600;font-size:14px}
.switch{position:relative;width:44px;height:26px;flex:none;display:inline-block}
.switch input{position:absolute;inset:0;opacity:0;cursor:pointer;z-index:1;margin:0}
.switch span{position:absolute;inset:0;border-radius:99px;background:#CBD3E1;transition:background .2s}
.switch span::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.25);transition:transform .2s}
.switch input:checked+span{background:var(--buy)}.switch input:checked+span::after{transform:translateX(18px)}
.divider{height:1px;background:var(--line-2);margin:18px 0}
.proof-dialog{width:min(720px,calc(100% - 28px));margin:auto;border-radius:20px;overflow:hidden;background:#0B1220}
.proof-dialog img{display:block;max-width:100%;max-height:82vh;margin:auto}
.proof-dialog .icon-btn{position:absolute;top:10px;right:10px;background:rgba(255,255,255,.92)}

@media (min-width:760px){
  .mrow{grid-template-columns:minmax(220px,1.3fr) 1fr 1fr auto;gap:26px;padding:22px 26px;align-items:center}
  .ident{grid-column:auto}.macts{grid-column:auto;display:flex}
  .wrap{width:min(900px,100% - 40px)}
  .sheet{margin:0 0 0 auto;height:100dvh;max-height:none;width:min(520px,100%);border-radius:26px 0 0 26px}
  .sheet[open]{animation:none}
}
@media (max-width:420px){.best{padding:18px;gap:12px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2.5"/><path d="M5 15V6.5A2.5 2.5 0 0 1 7.5 4H15"/></symbol>
<symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
<symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>

<div class="toasts" id="toasts" aria-live="polite"></div>

<script>
// Set this to your backend URL (same as app.html and bingo.html)
const API_URL = 'https://gmae-production-a450.up.railway.app';

const tg = window.Telegram && window.Telegram.WebApp;
const params = new URLSearchParams(location.search);
const BOT = params.get('b');
// Orders and the admin panel need Telegram's signed login. Without it the page is a read-only price list.
const signedIn = !!(tg && tg.initData && BOT);
if (tg) { try { tg.ready(); tg.expand(); } catch {} }

const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = (n, d=2) => Number(n || 0).toLocaleString('en-US', { minimumFractionDigits:d, maximumFractionDigits:d });
const ic = (n, c='') => `<svg class="ic ${c}" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const hue = s => { let h = 0; for (const c of s) h = (h * 31 + c.charCodeAt(0)) % 360; return h; };
const mono = n => n.trim().slice(0,2).toUpperCase();
const when = iso => new Date(iso).toLocaleString('en-GB', { day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit' });

async function api(path, method='GET', body){
  const res = await fetch(API_URL + path, {
    method,
    headers: { 'Content-Type':'application/json', ...(signedIn ? { Authorization:`tma ${tg.initData}` } : {}) },
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || 'Something went wrong. Please try again.');
  return data;
}

function toast(msg, type='ok'){
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.innerHTML = ic(type === 'error' ? 'alert' : 'check') + `<span>${esc(msg)}</span>`;
  $('#toasts').appendChild(el);
  setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 260); }, 2600);
}
function confirmAsk(msg){
  return new Promise(res => (tg && tg.showConfirm) ? tg.showConfirm(msg, ok => res(!!ok)) : res(confirm(msg)));
}

async function copyText(t){
  try { await navigator.clipboard.writeText(t); return true; }
  catch {
    const ta = document.createElement('textarea');
    ta.value = t; ta.style.cssText = 'position:fixed;opacity:0';
    document.body.appendChild(ta); ta.select();
    let ok = false; try { ok = document.execCommand('copy'); } catch {}
    ta.remove(); return ok;
  }
}
const copyBtn = (val, label, xs) => `<button type="button" class="copy ${xs?'xs':''}" data-copy="${esc(val)}" data-label="${esc(label)}" aria-label="Copy ${esc(label)}">${ic('copy','sm')}<span>Copy</span></button>`;
const copyRow = (label, value, raw, id) => `<div class="copyrow"><div><span class="k">${esc(label)}</span><span class="v" ${id?`id="${id}"`:''}>${esc(value)}</span></div>${copyBtn(raw ?? value, label)}</div>`;

// Chat link to a desk or customer. A username is preferred, the numeric ID is the fallback.
function chatLink(username, id, text){
  if (username) return `https://t.me/${username}` + (text ? `?text=${encodeURIComponent(text)}` : '');
  return `tg://user?id=${id}`;
}
const chatLabel = (username, id) => username ? '@' + username : 'ID ' + id;
const chip = (username, id, text) => `<a class="tg" data-tg href="${esc(chatLink(username, id, text))}" target="_blank" rel="noopener">${ic('send','sm')}${esc(chatLabel(username, id))}</a>`;
document.addEventListener('click', e => {
  const a = e.target.closest('a[data-tg]');
  if (a && tg && tg.openTelegramLink && /^https:\/\/t\.me\//.test(a.href)) { e.preventDefault(); tg.openTelegramLink(a.href); }
});

function readImage(file){
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onerror = rej;
    r.onload = () => {
      const img = new Image();
      img.onerror = rej;
      img.onload = () => {
        const s = Math.min(1, 1000 / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        let q = .75, out = c.toDataURL('image/jpeg', q);
        while (out.length > 700000 && q > .35) { q -= .1; out = c.toDataURL('image/jpeg', q); }
        res(out);
      };
      img.src = r.result;
    };
    r.readAsDataURL(file);
  });
}

/* ===================== Customer: price list ===================== */
let platforms = [], botPlatformId = null, isAdmin = false;

async function loadHome(){
  try {
    const d = await api(signedIn ? `/api/p2p/${BOT}/home` : '/api/p2p/public');
    platforms = d.platforms || []; botPlatformId = d.bot_platform_id || null; isAdmin = !!d.is_admin;
    renderHome();
    renderNav();
    if (isAdmin && params.get('desk') === '1') openDesk();
  } catch (e) {
    $('#market').innerHTML = `<div class="empty"><strong>Could not load rates</strong>${esc(e.message)}<br><button class="btn btn-ghost sm" style="margin-top:14px" data-act="retry">Try again</button></div>`;
  }
}

function renderNav(){
  // The Admin switch only exists in the page for verified desk admins.
  $('#navSlot').innerHTML = isAdmin
    ? `<button class="deskbtn" data-act="open-desk">${ic('shield','sm')}Admin<span class="badge" id="navBadge" hidden></span></button>` : '';
  if (isAdmin) refreshBadge();
}

function renderHome(){
  const act = platforms;
  const bestBuy = act.length ? act.reduce((a,b) => b.buy_rate < a.buy_rate ? b : a) : null;
  const bestSell = act.length ? act.reduce((a,b) => b.sell_rate > a.sell_rate ? b : a) : null;
  $('#best').innerHTML = act.length ? `
    <div class="best">
      <div class="buyc"><div class="k">Lowest buy price</div><div class="n">${fmt(bestBuy.buy_rate)}<small>ETB</small></div><div class="who">${esc(bestBuy.name)}</div></div>
      <div class="sellc"><div class="k">Highest sell price</div><div class="n">${fmt(bestSell.sell_rate)}<small>ETB</small></div><div class="who">${esc(bestSell.name)}</div></div>
    </div>` : '';
  $('#notice').innerHTML = signedIn ? '' : `<div class="notice">${ic('info')}<span>Open this page from the bot in Telegram to place an order. You can still compare rates here.</span></div>`;

  const list = [...act].sort((a,b) => (b.id === botPlatformId) - (a.id === botPlatformId) || a.buy_rate - b.buy_rate);
  $('#market').innerHTML = list.length ? list.map(p => `
    <article class="mrow">
      <div class="ident">
        <div class="av" style="--h:${hue(p.name)}">${esc(mono(p.name))}</div>
        <div class="ident-text">
          <strong>${esc(p.name)}${p.id === botPlatformId ? '<span class="pill blue">This bot</span>' : ''}</strong>
          ${chip(p.contact_username, p.contact_id)}
        </div>
      </div>
      <div class="rate buy"><span class="k">Buy USDT at ${p === bestBuy ? '<span class="pill">Best</span>' : ''}</span><div class="n">${fmt(p.buy_rate)}<small>ETB</small></div></div>
      <div class="rate sell"><span class="k">Sell USDT at ${p === bestSell ? '<span class="pill">Best</span>' : ''}</span><div class="n">${fmt(p.sell_rate)}<small>ETB</small></div></div>
      ${signedIn ? `<div class="macts">
        <button class="btn btn-buy" data-act="trade" data-id="${p.id}" data-mode="buy">Buy</button>
        <button class="btn btn-sell" data-act="trade" data-id="${p.id}" data-mode="sell">Sell</button>
      </div>` : ''}
    </article>`).join('')
  : `<div class="empty"><strong>No platforms are open yet</strong>Check back soon.</div>`;
}

/* ===================== Customer: trade sheet ===================== */
const trade = {};
const getP = id => platforms.find(p => p.id === id);
const tRate = () => { const p = getP(trade.pid); return trade.mode === 'buy' ? p.buy_rate : p.sell_rate; };
const tTotal = () => (Number(trade.amount) || 0) * tRate();

async function openTrade(pid, mode){
  Object.assign(trade, { pid, mode, amount:'', uid:'', name:'', phone:'', proof:null, proofName:'', pay:null, payError:'', done:null, busy:false });
  $('#tradeSheet').innerHTML = `<div class="loadbox">Loading payment details</div>`;
  $('#tradeSheet').showModal();
  try { trade.pay = await api(`/api/p2p/${BOT}/platforms/${pid}/payment`); }
  catch (e) { trade.payError = e.message; }
  renderTrade();
}

function proofBlock(){
  return trade.proof ? `
    <div class="proof-ok"><img src="${trade.proof}" alt="Payment proof preview"><div><strong>${esc(trade.proofName)}</strong><span>Ready to send</span></div>
    <button type="button" class="btn btn-ghost sm" data-act="clear-proof">Replace</button></div>` : `
    <label class="drop" id="drop">${ic('upload')}<strong>Choose a screenshot</strong><span>Your ${trade.mode==='buy'?'payment':'USDT transfer'} receipt, as an image</span><input type="file" id="proofInput" accept="image/*"></label>`;
}

function renderTrade(){
  const p = getP(trade.pid), pay = trade.pay, buy = trade.mode === 'buy';
  if (trade.done) return renderDone(p);
  const missing = !pay ? trade.payError
    : buy && !pay.telebirr_phone && !pay.cbe_account ? 'This platform has not set payment details yet.'
    : !buy && !pay.binance_uid ? 'This platform has not set a Binance UID yet.' : '';

  const buyBody = pay ? `
    <div class="ssect">Pay this amount</div>
    <div class="pay">${copyRow('Total to pay in ETB', fmt(tTotal()) + ' ETB', tTotal().toFixed(2), 'tPay')}</div>
    <div class="ssect">Send it to</div>
    ${pay.telebirr_phone ? `<div class="pay"><div class="pay-head"><span class="logo-chip tb">TB</span>Telebirr</div>
      ${copyRow('Phone number', pay.telebirr_phone)}${pay.telebirr_name ? copyRow('Account name', pay.telebirr_name) : ''}</div>` : ''}
    ${pay.cbe_account ? `<div class="pay"><div class="pay-head"><span class="logo-chip cbe">CBE</span>Commercial Bank of Ethiopia</div>
      ${copyRow('Account number', pay.cbe_account)}${pay.cbe_name ? copyRow('Account name', pay.cbe_name) : ''}</div>` : ''}
    <div class="field" style="margin-top:22px"><label for="fUid">Your Binance UID</label>
      <input id="fUid" data-f="uid" type="text" inputmode="numeric" placeholder="Where we send your USDT" value="${esc(trade.uid)}" autocomplete="off"></div>` : '';

  const sellBody = pay ? `
    <div class="ssect">Send USDT to</div>
    <div class="pay"><div class="pay-head"><span class="logo-chip bn">BN</span>Binance transfer</div>
      ${copyRow('Binance UID', pay.binance_uid)}
      ${copyRow('Exact amount', fmt(Number(trade.amount) || 0) + ' USDT', String(Number(trade.amount) || 0), 'tUsdt')}</div>
    <div class="ssect">Where we pay you</div>
    <div class="field"><label for="fName">Your full name</label><input id="fName" data-f="name" type="text" value="${esc(trade.name)}" autocomplete="name"></div>
    <div class="field"><label for="fPhone">Your Telebirr number</label><input id="fPhone" data-f="phone" type="tel" placeholder="09XXXXXXXX" value="${esc(trade.phone)}" autocomplete="tel"></div>` : '';

  $('#tradeSheet').innerHTML = `
    <header class="sh-head">
      <div class="av" style="--h:${hue(p.name)}">${esc(mono(p.name))}</div>
      <div class="ident-text"><h2>${esc(p.name)}</h2>${chip(p.contact_username, p.contact_id)}</div>
      <button type="button" class="icon-btn" data-act="close-sheet" aria-label="Close">${ic('close')}</button>
    </header>
    <form class="sh-form" id="tForm" novalidate>
      <div class="sh-body">
        <div class="seg" data-mode="${trade.mode}"><span class="thumb"></span>
          <button type="button" data-act="set-mode" data-mode="buy" aria-selected="${buy}">Buy USDT</button>
          <button type="button" data-act="set-mode" data-mode="sell" aria-selected="${!buy}">Sell USDT</button></div>
        <div class="field"><label for="fAmount">USDT amount</label>
          <div class="inwrap"><input id="fAmount" data-f="amount" type="number" inputmode="decimal" min="0" step="any" placeholder="100" value="${esc(trade.amount)}"><span class="suffix">USDT</span></div>
          <div class="chips">${[50,100,250,500].map(v => `<button type="button" class="chip" data-act="quick" data-v="${v}">${v}</button>`).join('')}</div>
          <p class="hint">Rate: ${fmt(tRate())} ETB per USDT</p></div>
        ${missing ? `<div class="notice" style="margin-top:18px">${ic('alert')}<span>${esc(missing)}</span></div>` : (buy ? buyBody : sellBody)}
        ${missing ? '' : `<div class="ssect">${buy ? 'Upload payment proof' : 'Upload transfer proof'}</div><div id="proofSlot" style="margin-bottom:16px">${proofBlock()}</div>`}
      </div>
      <div class="sh-foot">
        <p class="err" id="tErr" role="alert" hidden></p>
        <div class="foot-total"><span>${buy ? 'You pay' : 'You receive'}</span><strong id="tTotal">${fmt(tTotal())} ETB</strong></div>
        <button class="btn ${buy ? 'btn-buy' : 'btn-sell solid'} btn-block" type="submit" ${missing ? 'disabled' : ''}>Place ${buy ? 'buy' : 'sell'} order</button>
      </div>
    </form>`;
}

function updateTradeTotals(){
  const t = tTotal(), amt = Number(trade.amount) || 0;
  const set = (id, txt, raw) => { const el = $(id); if (!el) return; el.textContent = txt; const b = el.closest('.copyrow')?.querySelector('[data-copy]'); if (b) b.dataset.copy = raw; };
  $('#tTotal').textContent = fmt(t) + ' ETB';
  set('#tPay', fmt(t) + ' ETB', t.toFixed(2));
  set('#tUsdt', fmt(amt) + ' USDT', String(amt));
}

function renderDone(p){
  const o = trade.done, text = `Hi, I placed ${o.type} order ${o.code} for ${fmt(o.usdt_amount)} USDT on Cross P2P.`;
  const pl = o.platform;
  $('#tradeSheet').innerHTML = `
    <div class="done">
      <svg class="badge" viewBox="0 0 84 84"><circle cx="42" cy="42" r="38"/><path d="M27 43l10 10 20-22"/></svg>
      <h2>Order placed</h2>
      <p>${esc(p.name)} will check your proof. You will get a message in this chat when it is approved or rejected.</p>
      <div class="pay">${copyRow('Order ID', o.code)}${copyRow(o.type === 'buy' ? 'You pay' : 'You receive', fmt(o.etb_total) + ' ETB', o.etb_total.toFixed(2))}</div>
      <a class="btn btn-primary btn-block" data-tg href="${esc(chatLink(pl.contact_username, pl.contact_id, text))}" target="_blank" rel="noopener">${ic('send')}Message ${esc(chatLabel(pl.contact_username, pl.contact_id))}</a>
      <button type="button" class="btn btn-ghost btn-block" data-act="close-sheet">Done</button>
    </div>`;
}

async function attachProof(file){
  if (!file || !file.type.startsWith('image/')) return toast('Choose an image file.', 'error');
  try { trade.proof = await readImage(file); trade.proofName = file.name; $('#proofSlot').innerHTML = proofBlock(); }
  catch { toast('That image could not be read.', 'error'); }
}

function tradeError(msg, field){
  const e = $('#tErr'); e.textContent = msg; e.hidden = false;
  $$('#tForm [aria-invalid]').forEach(i => i.removeAttribute('aria-invalid'));
  if (field){ const f = $(field); f?.setAttribute('aria-invalid', 'true'); f?.focus(); }
}

async function submitTrade(){
  if (trade.busy) return;
  const buy = trade.mode === 'buy', amt = Number(trade.amount);
  $('#tErr').hidden = true;
  if (!(amt >= 1)) return tradeError('Enter at least 1 USDT.', '#fAmount');
  if (amt > 100000) return tradeError('The limit is 100,000 USDT per order.', '#fAmount');
  if (buy){
    if (!/^\d{5,15}$/.test(trade.uid.trim())) return tradeError('Enter your Binance UID using digits only.', '#fUid');
  } else {
    if (trade.name.trim().length < 2) return tradeError('Enter your full name.', '#fName');
    if (!/^(?:\+?251|0)[79]\d{8}$/.test(trade.phone.replace(/\s/g,''))) return tradeError('Enter a valid Telebirr number, like 0911234567.', '#fPhone');
  }
  if (!trade.proof) return tradeError('Upload your proof of ' + (buy ? 'payment.' : 'transfer.'));

  const btn = $('#tForm button[type=submit]'); trade.busy = true; btn.disabled = true; btn.textContent = 'Sending order';
  try {
    trade.done = await api(`/api/p2p/${BOT}/orders`, 'POST', {
      platform_id: trade.pid, type: trade.mode, amount: amt, proof: trade.proof,
      ...(buy ? { binance_uid: trade.uid.trim() } : { name: trade.name.trim(), phone: trade.phone.replace(/\s/g,'') }),
    });
    renderTrade();
  } catch (e) {
    trade.busy = false; btn.disabled = false; btn.textContent = `Place ${buy ? 'buy' : 'sell'} order`;
    tradeError(e.message);
  }
}

/* ===================== Desk admin ===================== */
const D = { tab:'orders', filter:'pending', platforms:[], orders:[], timer:null };

async function refreshBadge(){
  try {
    const d = await api(`/api/p2p/${BOT}/desk`);
    D.platforms = d.platforms;
    const n = d.platforms.reduce((s,p) => s + p.pending, 0), b = $('#navBadge');
    if (b){ b.textContent = n; b.hidden = !n; }
  } catch {}
}

async function openDesk(){
  $('#home').hidden = true; $('#desk').hidden = false; window.scrollTo(0, 0);
  if (tg && tg.BackButton){ tg.BackButton.show(); tg.BackButton.onClick(closeDesk); }
  await loadDesk();
  clearInterval(D.timer);
  D.timer = setInterval(() => { if (D.tab === 'orders' && !document.hidden) loadDesk(true); }, 20000);
}
function closeDesk(){
  clearInterval(D.timer);
  if (tg && tg.BackButton){ tg.BackButton.hide(); tg.BackButton.offClick(closeDesk); }
  $('#desk').hidden = true; $('#home').hidden = false; refreshBadge(); loadHome();
}

async function loadDesk(quiet){
  try {
    const [d, o] = await Promise.all([ api(`/api/p2p/${BOT}/desk`), api(`/api/p2p/${BOT}/desk/orders?status=${D.filter}`) ]);
    D.platforms = d.platforms; D.orders = o;
    if (!(quiet && D.tab === 'platforms')) renderDesk();
  } catch (e) { if (!quiet) toast(e.message, 'error'); }
}

function renderDesk(){
  const pending = D.platforms.reduce((s,p) => s + p.pending, 0);
  const names = D.platforms.map(p => p.name).join(', ');
  $('#desk').innerHTML = `
    <button class="backbtn" data-act="close-desk" style="margin-bottom:16px">${ic('back','sm')}Back to rates</button>
    <h1>Admin</h1>
    <p class="sub">${esc(names)}</p>
    <div class="tabs" role="group" aria-label="Admin sections">
      <button data-act="desk-tab" data-tab="orders" aria-pressed="${D.tab==='orders'}">Orders${pending ? `<span class="n">${pending}</span>` : ''}</button>
      <button data-act="desk-tab" data-tab="platforms" aria-pressed="${D.tab==='platforms'}">My platform</button>
    </div>
    ${D.tab === 'orders' ? deskOrders() : deskPlatforms()}`;
}

function deskOrders(){
  const f = [['pending','Pending'],['approved','Approved'],['rejected','Rejected']];
  return `
    <div class="tabs" role="group" aria-label="Filter orders" style="display:flex">${f.map(([k,l]) => `<button data-act="desk-filter" data-v="${k}" aria-pressed="${D.filter===k}">${l}</button>`).join('')}</div>
    <div class="list">${D.orders.length ? D.orders.map(orderCard).join('') : `<div class="panel empty"><strong>No ${D.filter} orders</strong>New orders show up here and you also get a message from the bot.</div>`}</div>`;
}

function orderCard(o){
  const buy = o.type === 'buy';
  const cust = buy
    ? `<span class="k">Binance UID to send USDT to</span><span class="v">${esc(o.binance_uid)} ${copyBtn(o.binance_uid,'Binance UID',true)}</span>`
    : `<span class="k">${esc(o.payout_name)}, Telebirr to pay</span><span class="v">${esc(o.payout_phone)} ${copyBtn(o.payout_phone,'phone number',true)}</span>`;
  return `
  <article class="ord" data-status="${o.status}">
    <div class="ord-head"><span class="tag ${buy?'buy':'sell'}">${buy?'Buy':'Sell'}</span><strong>${esc(o.code)}</strong><span class="st ${o.status}">${o.status[0].toUpperCase()+o.status.slice(1)}</span></div>
    <div class="ord-grid">
      <div><span class="k">Amount</span><span class="v">${fmt(o.usdt_amount)} USDT</span></div>
      <div><span class="k">Rate</span><span class="v">${fmt(o.rate)} ETB</span></div>
      <div class="full"><span class="k">${buy ? 'Customer paid' : 'Customer receives'}</span><span class="v">${fmt(o.etb_total)} ETB ${copyBtn(o.etb_total.toFixed(2),'total',true)}</span></div>
      <div class="full">${cust}</div>
      <div><span class="k">Customer</span><span class="v">${chip(o.customer_username, o.customer_telegram_id)}</span></div>
      <div><span class="k">Placed</span><span class="v">${when(o.created_at)}</span></div>
    </div>
    <div class="ord-foot">
      <button class="thumb-btn" data-act="proof" data-url="${esc(o.proof_url || '')}" aria-label="View proof">${o.proof_url ? `<img src="${esc(o.proof_url)}" alt="Payment proof">` : ic('image')}</button>
      ${o.status === 'pending' ? `<div class="ord-acts"><button class="btn btn-danger sm" data-act="decide" data-do="reject" data-id="${o.id}" data-code="${esc(o.code)}">Reject</button><button class="btn btn-buy sm" data-act="decide" data-do="approve" data-id="${o.id}" data-code="${esc(o.code)}">Approve</button></div>` : ''}
    </div>
  </article>`;
}

function deskPlatforms(){
  return D.platforms.map(p => `
    <form class="panel" data-form="desk-platform" data-id="${p.id}" novalidate>
      <div class="row"><h3>${esc(p.name)}</h3><span class="pill blue">Telegram ID ${esc(p.telegram_id)}</span></div>
      <div class="two">
        <div class="field"><label>Buy rate</label><div class="inwrap"><input name="buy_rate" type="number" step="0.01" min="0" value="${p.buy_rate}"><span class="suffix">ETB</span></div><p class="hint">Customer pays per USDT</p></div>
        <div class="field"><label>Sell rate</label><div class="inwrap"><input name="sell_rate" type="number" step="0.01" min="0" value="${p.sell_rate}"><span class="suffix">ETB</span></div><p class="hint">Customer receives per USDT</p></div>
      </div>
      <div class="switchrow"><span>Open for trading</span><label class="switch"><input type="checkbox" name="active" ${p.active?'checked':''} aria-label="Open for trading"><span></span></label></div>
      <div class="divider"></div>
      <div class="two">
        <div class="field"><label>Telebirr phone</label><input name="telebirr_phone" type="tel" value="${esc(p.telebirr_phone)}"></div>
        <div class="field"><label>Telebirr name</label><input name="telebirr_name" type="text" value="${esc(p.telebirr_name)}"></div>
        <div class="field"><label>CBE account</label><input name="cbe_account" type="text" inputmode="numeric" value="${esc(p.cbe_account)}"></div>
        <div class="field"><label>CBE name</label><input name="cbe_name" type="text" value="${esc(p.cbe_name)}"></div>
      </div>
      <div class="field"><label>Binance UID</label><input name="binance_uid" type="text" inputmode="numeric" value="${esc(p.binance_uid)}"><p class="hint">Customers send USDT here when they sell.</p></div>
      <p class="err" data-err hidden style="margin-top:14px"></p>
      <button class="btn btn-primary btn-block" type="submit" style="margin-top:16px">Save changes</button>
    </form>`).join('');
}

async function saveDeskPlatform(form){
  const g = n => form.elements[n].value.trim(), er = $('[data-err]', form);
  er.hidden = true;
  const btn = $('button[type=submit]', form); btn.disabled = true;
  try {
    await api(`/api/p2p/${BOT}/desk/platforms/${form.dataset.id}`, 'PATCH', {
      buy_rate: Number(g('buy_rate')), sell_rate: Number(g('sell_rate')), active: form.elements.active.checked,
      telebirr_phone: g('telebirr_phone'), telebirr_name: g('telebirr_name'),
      cbe_account: g('cbe_account'), cbe_name: g('cbe_name'), binance_uid: g('binance_uid'),
    });
    toast('Platform saved');
    await loadDesk();
  } catch (e) { er.textContent = e.message; er.hidden = false; }
  btn.disabled = false;
}

/* ===================== Events ===================== */
document.addEventListener('click', async e => {
  const c = e.target.closest('[data-copy]');
  if (c){
    if (await copyText(c.dataset.copy)){
      c.classList.add('copied'); const s = $('span', c);
      c.firstElementChild.innerHTML = '<use href="#i-check"/>'; s.textContent = 'Copied';
      toast(`${c.dataset.label || 'Value'} copied`);
      setTimeout(() => { c.classList.remove('copied'); s.textContent = 'Copy'; c.firstElementChild.innerHTML = '<use href="#i-copy"/>'; }, 1700);
    } else toast('Copy is blocked here. Press and hold the text to copy it.', 'error');
    return;
  }
  const t = e.target.closest('[data-act]'); if (!t) return;
  const act = t.dataset.act, id = Number(t.dataset.id);
  switch (act){
    case 'retry': loadHome(); break;
    case 'trade': openTrade(id, t.dataset.mode); break;
    case 'close-sheet': $('#tradeSheet').close(); break;
    case 'set-mode': trade.mode = t.dataset.mode; trade.proof = null; renderTrade(); break;
    case 'quick': trade.amount = t.dataset.v; $('#fAmount').value = t.dataset.v; updateTradeTotals(); break;
    case 'clear-proof': trade.proof = null; $('#proofSlot').innerHTML = proofBlock(); break;
    case 'open-desk': openDesk(); break;
    case 'close-desk': closeDesk(); break;
    case 'desk-tab': D.tab = t.dataset.tab; renderDesk(); break;
    case 'desk-filter': D.filter = t.dataset.v; loadDesk(); break;
    case 'proof': if (t.dataset.url){ $('#proofImg').src = t.dataset.url; $('#proofDialog').showModal(); } break;
    case 'close-proof': $('#proofDialog').close(); break;
    case 'decide': {
      const approve = t.dataset.do === 'approve';
      const ok = await confirmAsk(approve ? `Approve ${t.dataset.code}? Only approve after you checked the real payment.` : `Reject ${t.dataset.code}?`);
      if (!ok) break;
      t.disabled = true;
      try { await api(`/api/p2p/${BOT}/desk/orders/${id}/${t.dataset.do}`, 'POST'); toast(approve ? 'Order approved' : 'Order rejected'); }
      catch (err) { toast(err.message, 'error'); }
      loadDesk(); break;
    }
  }
});
document.addEventListener('change', e => { if (e.target.id === 'proofInput') attachProof(e.target.files[0]); });
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.f){ trade[t.dataset.f] = t.value; t.removeAttribute('aria-invalid'); if (t.dataset.f === 'amount') updateTradeTotals(); }
});
document.addEventListener('submit', e => {
  e.preventDefault();
  if (e.target.id === 'tForm') submitTrade();
  else if (e.target.dataset.form === 'desk-platform') saveDeskPlatform(e.target);
});
$('#tradeSheet').addEventListener('click', e => { if (e.target === e.currentTarget) e.currentTarget.close(); });
$('#tradeSheet').addEventListener('close', () => { if (trade.done) { loadHome(); } });

loadHome();
</script>
</body>
</html>
