<style>

<script>
(() => {
'use strict';
const API_URL = 'https://gmae-production-13bb.up.railway.app';
const tg = window.Telegram && window.Telegram.WebApp;
const BOT = new URLSearchParams(location.search).get('b');
const $ = (id) => document.getElementById(id);
const fmt = (n) => Number(n || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const floor2 = (n) => Math.floor(n * 100 + 1e-9) / 100;
const clamp = (n, a, b) => Math.min(b, Math.max(a, n));
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const ls = (k, d) => { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (_) { return d; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (_) {} };
const enc = new TextEncoder();
const toHex = (u) => Array.from(u, (b) => b.toString(16).padStart(2, '0')).join('');
const sha = async (t) => new Uint8Array(await crypto.subtle.digest('SHA-256', enc.encode(t)));
const randHex = (n) => toHex(crypto.getRandomValues(new Uint8Array(n)));

async function api(path, method = 'GET', body) {
  const ctl = new AbortController(); const timer = setTimeout(() => ctl.abort(), 20000); let res;
  try { res = await fetch(`${API_URL}${path}`, { method, headers: { 'Content-Type': 'application/json', Authorization: `tma ${tg.initData}` }, body: body ? JSON.stringify(body) : undefined, signal: ctl.signal }); }
  catch (e) { throw new Error(e && e.name === 'AbortError' ? 'The server is taking too long to answer. Please try again.' : 'Could not reach the server. Check your internet connection.'); }
  finally { clearTimeout(timer); }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) { const err = new Error(data.error || 'Something went wrong.'); err.status = res.status; err.data = data; throw err; }
  return data;
}

/* ---- sound ---- */
let audio = null, soundOn = ls('cf_sound', '1') === '1';
function tone(freq, dur, type = 'sine', vol = .07, slide = null, delay = 0) { if (!soundOn) return; try { audio = audio || new (window.AudioContext || window.webkitAudioContext)(); const t0 = audio.currentTime + delay, o = audio.createOscillator(), g = audio.createGain(); o.type = type; o.frequency.setValueAtTime(freq, t0); if (slide) o.frequency.exponentialRampToValueAtTime(slide, t0 + dur); g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(.0001, t0 + dur); o.connect(g); g.connect(audio.destination); o.start(t0); o.stop(t0 + dur + .02); } catch (_) {} }
const buzz = (ms) => { try { navigator.vibrate && navigator.vibrate(ms); } catch (_) {} };
const sfx = { win() { tone(523, .12, 'sine', .08); tone(784, .22, 'sine', .08, null, .11); buzz(25); }, lose() { tone(160, .4, 'sawtooth', .09, 45); buzz(60); }, click() { tone(380, .07, 'triangle', .05, 520); } };

/* ---- state ---- */
let cfg = { min: 1, max: 500, step: 1.94, maxFlips: 10 };
let W = { balance: 0, bonus: 0 };
let me = null, R = null, call = 0, busy = false, rot = 0, last = null, nextHash = '', nextNonce = 0;
const mult = (k) => (k === 0 ? 1 : Math.pow(cfg.step, k));

function status(t, c = '') { const s = $('status'); s.textContent = t; s.className = 'status ' + c; }
function paintWallet() { $('bal').textContent = fmt(W.balance); $('bonusChip').hidden = !(W.bonus > 0); $('bonus').textContent = fmt(W.bonus); }
function setWallet(r) { if (r && r.balance != null) W.balance = Number(r.balance); if (r && r.reg_bonus != null) W.bonus = Number(r.reg_bonus); paintWallet(); }
const playable = () => floor2(W.balance + W.bonus);

function paintSteps(k) { $('streak').innerHTML = Array.from({ length: cfg.maxFlips }, (_, i) => `<span class="step ${i < k ? 'done' : i === k ? 'next' : ''}">${mult(i + 1).toFixed(2)}x</span>`).join(''); }
function lockBet(l) { $('bet').disabled = l; document.querySelectorAll('[data-bet]').forEach((c) => { c.disabled = l; }); $('fClient').disabled = l; }
function paint() {
  const k = R ? R.k : 0, pay = R ? R.payout : 0;
  $('mult').textContent = 'x' + mult(k).toFixed(2);
  $('payout').textContent = fmt(pay);
  paintSteps(k);
  $('cash').hidden = !R;
  $('cash').disabled = busy || !R || k === 0;
  $('cash').textContent = R && k > 0 ? `Cash out ${fmt(pay)} ETB` : 'Cash out';
  $('go').textContent = R ? 'Flip again' : 'Flip the coin';
  $('go').disabled = busy;
  document.querySelectorAll('#call .chip').forEach((c) => c.setAttribute('aria-pressed', String(Number(c.dataset.v) === call)));
  lockBet(!!R || busy);
  paintFair();
}
function renderHistory(list) {
  const h = $('history');
  if (!list || !list.length) { h.innerHTML = '<span class="empty">No rounds yet.</span>'; return; }
  h.innerHTML = list.map((r) => `<span class="pill ${r.win ? 'w' : 'l'}">${r.win ? 'x' + Number(r.mult).toFixed(2) : 'Lost'}</span>`).join('');
}

/* ---- provably fair panel ---- */
function mountFair() {
  $('fairHost').innerHTML = `<details class="fair"><summary><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 3v6c0 4.5-3.2 8-8 9-4.8-1-8-4.5-8-9V6l8-3z"/><path d="M8.5 12l2.5 2.5 4.5-5"/></svg>Provably fair</summary><div class="fair-body"><p>Before each round the server locks a secret seed and shows you its hash. You add your own client seed. When the round ends the seed is revealed, so you can check that every flip came from it and nothing was changed afterwards.</p><div class="kv"><label for="fClient">Your client seed</label><input class="mono" id="fClient" maxlength="32" autocomplete="off" spellcheck="false"></div><div class="kv"><label>Server seed hash (locked before you play)</label><span class="mono" id="fHash">-</span></div><div class="kv"><label>Round number (nonce)</label><span class="mono" id="fNonce">0</span></div><div class="kv"><label>Server seed (shown after the round)</label><span class="mono" id="fSeed">Hidden until the round ends</span></div><button class="ghostbtn" id="fVerify" type="button" disabled>Verify last round</button><p class="verify" id="fOut" aria-live="polite"></p></div></details>`;
  $('fClient').value = ls('cf_client', '') || randHex(6);
  $('fClient').addEventListener('change', () => { const v = $('fClient').value.replace(/[^\w.\-]/g, '').slice(0, 32) || randHex(6); $('fClient').value = v; lsSet('cf_client', v); });
  $('fVerify').onclick = verify;
}
function paintFair() {
  if (!$('fHash')) return;
  if (R) { $('fClient').value = R.client_seed; $('fHash').textContent = R.server_seed_hash; $('fNonce').textContent = R.nonce; $('fSeed').textContent = 'Hidden until the round ends'; }
  else { $('fHash').textContent = nextHash || '-'; $('fNonce').textContent = nextNonce; if (last) $('fSeed').textContent = last.server_seed; else $('fSeed').textContent = 'Hidden until the round ends'; }
  $('fVerify').disabled = !last;
}
// Every flip i is the first 32 bits of SHA-256(`${seed}:${client}:${nonce}:${floor(i/8)}`) slice i%8, below 0.5 = heads.
async function flipsFor(seed, client, nonce, n) {
  const out = [], cache = {};
  for (let i = 0; i < n; i++) {
    const c = Math.floor(i / 8), k = i % 8;
    const h = cache[c] || (cache[c] = await sha(`${seed}:${client}:${nonce}:${c}`));
    out.push(((h[k * 4] * 16777216 + (h[k * 4 + 1] << 16) + (h[k * 4 + 2] << 8) + h[k * 4 + 3]) / 4294967296) < .5 ? 0 : 1);
  }
  return out;
}
async function verify() {
  const L = last; if (!L) return; const o = $('fOut'); o.textContent = 'Checking...';
  try {
    const hashOk = toHex(await sha(L.server_seed)) === L.server_seed_hash;
    const again = await flipsFor(L.server_seed, L.client_seed, L.nonce, L.flips.length);
    const ok = hashOk && JSON.stringify(again) === JSON.stringify(L.flips);
    o.innerHTML = ok ? '<b class="ok">Verified.</b> The seed matches the hash shown before the round and reproduces the same flips.' : '<b class="bad">Mismatch.</b> The revealed seed does not match this round.';
  } catch (_) { o.textContent = 'Could not verify on this device.'; }
}

/* ---- loading ---- */
async function load(quiet) {
  me = await api(`/api/mini/${BOT}/coinflip/me`);
  cfg = { min: me.min, max: me.max, step: me.step || cfg.step, maxFlips: me.max_flips || cfg.maxFlips };
  setWallet(me);
  const hist = me.history || [];
  last = hist[0] ? { server_seed: hist[0].server_seed, server_seed_hash: hist[0].server_seed_hash, client_seed: hist[0].client_seed, nonce: hist[0].nonce, flips: hist[0].flips } : null;
  nextNonce = hist[0] ? hist[0].nonce + 1 : 0;
  nextHash = me.next_hash || '';
  R = me.round || null;
  if (R) nextNonce = R.nonce;
  renderHistory(hist);
  if (!me.enabled) { status('Coin flip is switched off right now.', 'warn'); $('go').disabled = true; }
  else if (!quiet) status(R ? `Round in progress: ${R.k} correct. Cash out or flip again.` : 'Choose heads or tails, then flip. Every correct call multiplies your win.');
  if (!$('bet').value || !Number($('bet').value)) $('bet').value = Math.max(cfg.min, Math.min(10, cfg.max));
  paint();
}

function betValue() {
  const v = Number($('bet').value);
  if (!Number.isFinite(v) || v < cfg.min || v > cfg.max) { status(`Enter a bet between ${cfg.min} and ${cfg.max} ETB.`, 'warn'); return null; }
  if (v > playable() + 1e-9) { status('Not enough money in your Games wallet. Deposit first.', 'warn'); return null; }
  return floor2(v);
}

function finish(r, win) {
  const prev = R;
  R = null; busy = false;
  last = { server_seed: r.server_seed, server_seed_hash: r.server_seed_hash, client_seed: r.client_seed, nonce: r.nonce, flips: r.flips };
  $('fSeed').textContent = r.server_seed;
  setWallet(r);
  $('payout').className = 'big ' + (win ? 'win' : 'lose');
  if (win) { sfx.win(); status(`${r.auto ? 'Maximum reached. ' : ''}Cashed out ${fmt(r.payout)} ETB after ${r.k} correct ${r.k === 1 ? 'call' : 'calls'}.`, 'win'); }
  else { sfx.lose(); status(`Wrong call. You lost ${fmt(prev ? prev.stake : 0)} ETB.`, 'lose'); }
  load(true).then(() => { $('payout').className = 'big ' + (win ? 'win' : 'lose'); $('payout').textContent = fmt(win ? r.payout : 0); }).catch(() => {});
}

$('go').onclick = async () => {
  if (busy) return;
  let stake = null;
  if (!R) { stake = betValue(); if (stake === null) return; }
  busy = true; paint(); $('payout').className = 'big';
  try {
    const body = { call };
    if (!R) { body.stake = stake; body.client_seed = $('fClient').value; }
    const r = await api(`/api/mini/${BOT}/coinflip/flip`, 'POST', body);
    if (!R && !r.ended) {                       // the bet was placed by this flip
      R = { stake, k: 0, flips: [], payout: 0, server_seed_hash: r.server_seed_hash, client_seed: r.client_seed, nonce: r.nonce };
    }
    if (!R) R = { stake, k: 0, flips: [], payout: 0 };
    if (r.balance != null && !r.ended) setWallet(r);
    rot += 720 + ((r.flip * 180 - (rot % 360)) + 360) % 360;
    $('coin').style.transform = `rotateY(${rot}deg)`; sfx.click();
    await sleep(1150);
    if (r.ended) { finish(r, r.win); return; }
    R.k = r.k; R.flips = r.flips; R.payout = r.payout;
    tone(520 + R.k * 50, .15, 'sine', .08);
    status(`Correct. Cash out now or flip for x${mult(R.k + 1).toFixed(2)}.`, 'win');
    busy = false; paint();
  } catch (e) {
    busy = false;
    status(e.message, e.status === 402 ? 'warn' : 'lose');
    if (e.status === 409) await load(true).catch(() => {}); else paint();
  }
};
$('cash').onclick = async () => {
  if (!R || R.k === 0 || busy) return;
  busy = true; paint();
  try { const r = await api(`/api/mini/${BOT}/coinflip/cashout`, 'POST', {}); finish(r, true); }
  catch (e) { busy = false; status(e.message, 'lose'); await load(true).catch(() => {}); }
};
document.querySelectorAll('#call .chip').forEach((c) => { c.onclick = () => { if (!busy) { call = Number(c.dataset.v); paint(); } }; });
document.querySelectorAll('[data-bet]').forEach((b) => b.addEventListener('click', () => {
  const bet = $('bet'), cur = Number(bet.value) || cfg.min; let v = cur; const k = b.dataset.bet;
  if (k === 'min') v = cfg.min; if (k === 'half') v = cur / 2; if (k === 'double') v = cur * 2; if (k === 'max') v = Math.min(cfg.max, playable());
  bet.value = floor2(clamp(v, cfg.min, cfg.max));
}));
$('bet').addEventListener('blur', () => { $('bet').value = floor2(clamp(Number($('bet').value) || cfg.min, cfg.min, cfg.max)); });
const snd = $('snd'); snd.setAttribute('aria-pressed', String(soundOn));
snd.onclick = () => { soundOn = !soundOn; lsSet('cf_sound', soundOn ? '1' : '0'); snd.setAttribute('aria-pressed', String(soundOn)); };

/* ---- start ---- */
$('back').href = `games?b=${encodeURIComponent(BOT || '')}`;
mountFair();
if (!tg || !tg.initData || !BOT) { $('authFail').hidden = false; $('play').hidden = true; return; }
tg.ready(); tg.expand();
load().catch((e) => { status(e.message, 'lose'); });
})();
</script>
</main></body></html>
