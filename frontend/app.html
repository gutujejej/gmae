<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Tasks</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body { padding: 16px; align-items: flex-start; }
    .wrap { width: 100%; max-width: 420px; margin: 0 auto; }
    .progress { height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; margin: 10px 0 18px; }
    .progress > div { height: 100%; width: 0; background: var(--accent); transition: width .25s; }
    .task {
      display: flex; align-items: center; gap: 12px; width: 100%;
      padding: 13px 14px; margin-bottom: 8px; text-align: left;
      background: var(--panel-raised); border: 1px solid var(--border);
      border-radius: var(--radius); color: var(--text); font: inherit; font-size: 14px; cursor: pointer;
    }
    .task:hover { border-color: var(--accent-dim); }
    .task:disabled { opacity: .6; cursor: wait; }
    .task .tick {
      width: 22px; height: 22px; border-radius: 50%; flex-shrink: 0;
      border: 2px solid var(--border); display: flex; align-items: center; justify-content: center;
      font-size: 13px; color: transparent;
    }
    .task.done .tick { background: var(--ok); border-color: var(--ok); color: #fff; }
    .task .label { flex: 1; }
    .task .go { color: var(--faint); font-size: 12px; }
    .task.done .go { color: var(--ok); }
    .donebox { margin-top: 16px; padding: 14px; border-radius: var(--radius); background: var(--ok-bg); border: 1px solid rgba(61,163,93,.3); color: #94d1a6; font-size: 13.5px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1 id="title" style="font-size:18px;font-weight:600;margin-bottom:4px">Tasks</h1>
      <p class="sub" id="sub" style="margin-bottom:0">Open every task below.</p>
      <div class="progress"><div id="bar"></div></div>
      <div id="msg" class="msg"></div>
      <div id="list"></div>
      <div id="done" class="donebox hidden"></div>
      <button class="btn block hidden" id="closeBtn">Close</button>
    </div>
  </div>

  <script>
    // Set this to your backend URL (same as index.html / admin.html)
    const API_URL = 'https://gmae-production.up.railway.app';

    const tg = window.Telegram && window.Telegram.WebApp;
    const BOT = new URLSearchParams(location.search).get('b');
    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    const showMsg = (t) => { $('msg').textContent = t; $('msg').className = 'msg error'; };
    const clearMsg = () => { $('msg').className = 'msg'; };

    let state = null;
    let busy = false;

    async function api(path, method = 'GET', body) {
      const res = await fetch(`${API_URL}${path}`, {
        method,
        headers: { 'Content-Type': 'application/json', Authorization: `tma ${tg.initData}` },
        body: body ? JSON.stringify(body) : undefined,
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || 'Something went wrong. Please try again.');
      return data;
    }

    function openLink(url) {
      // t.me links open natively inside Telegram; anything else in the in-app browser.
      if (/^https:\/\/t\.me\//i.test(url)) tg.openTelegramLink(url);
      else tg.openLink(url);
    }

    function render() {
      if (!state) return;
      $('title').textContent = state.name || 'Tasks';
      $('bar').style.width = state.total ? `${(state.opened / state.total) * 100}%` : '100%';
      $('sub').textContent = state.complete
        ? 'All tasks opened.'
        : `Open every task below (${state.opened} of ${state.total} done).`;

      $('list').innerHTML = state.buttons.map((b) => `
        <button class="task ${b.opened ? 'done' : ''}" data-key="${esc(b.key)}" ${busy ? 'disabled' : ''}>
          <span class="tick">&#10003;</span>
          <span class="label">${esc(b.text)}</span>
          <span class="go">${b.opened ? 'Opened' : 'Open'}</span>
        </button>`).join('');

      document.querySelectorAll('.task').forEach((el) => {
        el.onclick = () => tap(el.dataset.key);
      });

      const done = state.complete;
      $('done').classList.toggle('hidden', !done);
      $('closeBtn').classList.toggle('hidden', !done);
      if (done) $('done').textContent = 'You are all set. Close this and tap Continue in the chat to get your bonus.';
    }

    async function tap(key) {
      if (busy) return;
      busy = true; clearMsg(); render();
      try {
        // The server records the tap first and only then returns the link.
        const r = await api(`/api/mini/${encodeURIComponent(BOT)}/click`, 'POST', { key });
        const { url, ...next } = r;
        state = next;
        busy = false; render();
        openLink(url);
      } catch (e) {
        busy = false; render();
        showMsg(e.message);
      }
    }

    $('closeBtn').onclick = () => tg.close();

    (async function init() {
      if (!tg || !tg.initData || !BOT) {
        $('sub').textContent = '';
        return showMsg('Please open this page from the bot inside Telegram.');
      }
      tg.ready();
      tg.expand();
      try {
        state = await api(`/api/mini/${encodeURIComponent(BOT)}/state`);
        render();
      } catch (e) { showMsg(e.message); }
    })();
  </script>
</body>
</html>
