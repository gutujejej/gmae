<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fast Keno</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#07110d;--bg2:#0b1812;--card:#101e17;--card2:#16281f;--cell:#16281f;--line:rgba(255,255,255,.08);--ink:#f1f7f3;--muted:#86a093;--green:#2bd47d;--green2:#17a35e;--yellow:#ffd24a;--red:#ff5d5d;--blue:#3aa0ff;--purple:#9b6bff;--orange:#ff9a3d;--display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;--body:"Roboto",system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased;user-select:none}
body{min-height:100vh;padding-bottom:84px;background:radial-gradient(120% 60% at 50% -10%,#123325 0%,var(--bg) 62%) fixed}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
input{user-select:text}
svg{display:block}
.wrap{width:min(640px,100%);margin:0 auto}

/* top bar + header */
.bar0{display:flex;justify-content:space-between;align-items:center;padding:10px 14px 10px 18px;background:rgba(0,0,0,.55);backdrop-filter:blur(8px);font-weight:700;font-size:16px;letter-spacing:.02em;position:sticky;top:0;z-index:20;border-bottom:1px solid var(--line)}
.x0{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center}
.x0 svg{width:18px;height:18px;stroke:#fff;stroke-width:2.4;fill:none;stroke-linecap:round}
.head{display:flex;align-items:center;gap:10px;padding:14px 14px 6px}
.logo{font-family:var(--display);font-weight:900;font-style:italic;font-size:30px;line-height:.86;color:#fff;transform:skewX(-8deg);flex:none;letter-spacing:.01em}
.logo b{display:block;color:var(--green);text-shadow:0 0 18px rgba(43,212,125,.45)}
.pillrow{flex:1;display:flex;align-items:center;gap:10px;min-width:0;border:1px solid rgba(43,212,125,.28);border-radius:16px;background:linear-gradient(180deg,#12241b,#0d1b14);padding:8px 12px}
.pillrow .wi{width:30px;height:30px;border-radius:10px;background:rgba(43,212,125,.14);color:var(--green);display:flex;align-items:center;justify-content:center;flex:none}
.pillrow .wi svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pillrow .mid{min-width:0;flex:1}
.pillrow .bal{color:var(--yellow);font-weight:700;font-size:20px;line-height:1.1;white-space:nowrap}
.pillrow .bal small{color:var(--muted);font-weight:500;font-size:11px;letter-spacing:.08em}
.pillrow .id{color:var(--muted);font-size:11.5px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ic{width:44px;height:44px;border-radius:14px;background:rgba(255,255,255,.06);border:1px solid var(--line);color:#dff3e7;display:flex;align-items:center;justify-content:center;flex:none}
.ic svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

/* round status */
.status{position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:6px;margin:8px 12px 10px;padding:14px 14px 18px;border-radius:18px;background:linear-gradient(160deg,#143124,#0c1812);border:1px solid rgba(43,212,125,.22);overflow:hidden}
.status::before{content:"";position:absolute;inset:-40% -10% auto auto;width:220px;height:220px;background:radial-gradient(circle,rgba(43,212,125,.22),transparent 65%);pointer-events:none}
.live{white-space:nowrap;display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:700;letter-spacing:.12em;color:var(--green)}
.live::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 0 rgba(43,212,125,.6);animation:pulse 1.6s infinite}
.live.warn{color:var(--yellow)}.live.warn::before{background:var(--yellow)}
@keyframes pulse{70%{box-shadow:0 0 0 8px rgba(43,212,125,0)}100%{box-shadow:0 0 0 0 rgba(43,212,125,0)}}
.status small{display:block;margin-top:5px;color:var(--muted);font-size:12px;white-space:nowrap}
.timer{text-align:center;font-family:var(--display);font-weight:800;font-size:46px;line-height:1;letter-spacing:.03em;color:#e8fff2;text-shadow:0 0 22px rgba(43,212,125,.55);font-variant-numeric:tabular-nums}
.timer.go{color:var(--yellow);text-shadow:0 0 22px rgba(255,210,74,.55)}
.timer.txt{font-size:34px}
.status .r{justify-self:end}
.chip{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:99px;background:rgba(255,255,255,.08);border:1px solid var(--line);font-size:13px;font-weight:700;color:#dff3e7}
.chip svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.chip:active{transform:scale(.96)}
.tbar{position:absolute;left:0;right:0;bottom:0;height:5px;background:rgba(255,255,255,.07)}
.tbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--green2),var(--green));border-radius:0 5px 5px 0;transition:width .25s linear}

/* live draw tray */
.tray{margin:0 12px 10px;padding:11px 12px 12px;border-radius:16px;background:var(--card);border:1px solid var(--line)}
.tray-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px;font-size:12px;font-weight:700;letter-spacing:.1em;color:var(--muted);text-transform:uppercase}
.tray-h b{color:var(--yellow);font-size:13px;letter-spacing:.04em}
.drawn{display:grid;grid-template-columns:repeat(10,1fr);gap:5px}
.drawn .e{aspect-ratio:1;border-radius:50%;border:1.5px dashed rgba(255,255,255,.14)}
.ball{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;font-weight:700;color:#fff;box-shadow:inset -4px -6px 10px rgba(0,0,0,.35),inset 3px 3px 6px rgba(255,255,255,.25);flex:none}
.b1{background:radial-gradient(circle at 30% 30%,#5dbcff,#1a63b8)}.b2{background:radial-gradient(circle at 30% 30%,#b99bff,#5a35b5)}.b3{background:radial-gradient(circle at 30% 30%,#ffbb6b,#c4631a)}.b4{background:radial-gradient(circle at 30% 30%,#6cf0a8,#13854f)}
.drawn .tb{width:100%;aspect-ratio:1;font-size:clamp(11px,3.5vw,16px);animation:pop .35s ease-out}
@keyframes pop{from{transform:scale(.2);opacity:0}}

/* picks bar + grid */
.picks{display:flex;align-items:center;gap:10px;margin:0 12px 8px;padding:10px 12px;border-radius:14px;background:var(--card);border:1px solid var(--line)}
.picks .l{flex:1;min-width:0}
.picks b{display:block;font-size:16px;font-weight:700}
.picks span{display:block;color:var(--muted);font-size:12px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dots{display:flex;gap:3px;margin-top:6px}
.dots i{width:14px;height:5px;border-radius:3px;background:rgba(255,255,255,.1);transition:background .15s}
.dots i.on{background:var(--green);box-shadow:0 0 8px rgba(43,212,125,.6)}
.picks .chip:disabled{opacity:.4}
.grid{display:grid;grid-template-columns:repeat(10,1fr);gap:5px;padding:0 12px}
.cell{position:relative;aspect-ratio:1/1;border-radius:9px;background:linear-gradient(180deg,#1b2f25,#13231b);border:1px solid var(--line);font-weight:500;font-size:clamp(13px,4.3vw,20px);color:#d5e6dc;display:flex;align-items:center;justify-content:center;transition:transform .1s,background .15s,box-shadow .15s}
.cell:active{transform:scale(.92)}
.cell.sel{background:linear-gradient(160deg,#2fe08a,#119553);border-color:transparent;color:#04170d;font-weight:700;box-shadow:0 0 0 2px rgba(43,212,125,.45),0 4px 14px rgba(43,212,125,.35)}
.cell.drawn{background:linear-gradient(160deg,#5a4712,#3a2d0a);border-color:rgba(255,210,74,.5);color:#ffe08a;font-weight:700}
.cell.hit{background:linear-gradient(160deg,#ffe27a,#f2a900);border-color:transparent;color:#3a2600;font-weight:800;box-shadow:0 0 0 2px #fff,0 0 18px rgba(255,210,74,.85);z-index:1}
.cell.mine:not(.hit){border-color:var(--green);box-shadow:inset 0 0 0 1px var(--green)}
.cell i{position:absolute;left:4px;top:4px;width:6px;height:6px;border-radius:50%}
.cell i.hot{background:#ff5b5b;box-shadow:0 0 6px #ff5b5b}.cell i.cold{background:#4ab6ff;box-shadow:0 0 6px #4ab6ff}
.grid.off .cell{pointer-events:none}
.grid.off .cell:not(.sel):not(.drawn):not(.hit):not(.mine){opacity:.55}

/* bet panel */
.bet{margin:12px 12px 0;padding:12px;border-radius:18px;background:var(--card);border:1px solid var(--line)}
.betrow{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto;gap:6px;align-items:stretch}
.stepbox{min-width:0;display:flex;align-items:center;background:#0a140f;border-radius:12px;border:1px solid var(--line)}
.stepbox button{width:40px;height:50px;color:#cfe3d8;display:flex;align-items:center;justify-content:center}
.stepbox button svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.6;stroke-linecap:round}
.stepbox input{flex:1;width:100%;min-width:0;background:none;border:0;outline:none;text-align:center;font-size:22px;font-weight:700;color:#fff}
.sq{background:#0a140f;border:1px solid var(--line);border-radius:12px;min-width:46px;padding:0 10px;color:var(--green);font-size:15px;font-weight:700;height:50px;display:flex;align-items:center;justify-content:center}
.sq svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sq:active{background:#12261b}
.betbtn{display:block;width:100%;margin-top:10px;height:58px;border-radius:14px;background:linear-gradient(180deg,#34e08a,#14a35c);color:#04170d;font-size:22px;font-weight:800;letter-spacing:.06em;box-shadow:0 6px 0 #0c6a3b,0 10px 22px rgba(43,212,125,.25);transition:transform .08s,box-shadow .08s}
.betbtn:active{transform:translateY(3px);box-shadow:0 3px 0 #0c6a3b}
.betbtn:disabled{background:#1b2b23;color:#6e8579;box-shadow:0 6px 0 #121d18}
.betbtn.cancel{background:linear-gradient(180deg,#ff6a6a,#c43a3a);color:#fff;box-shadow:0 6px 0 #7a1f1f}
.note{margin:10px 12px 0;padding:11px 14px;border-radius:12px;font-size:14px;background:#3a1a1a;color:#ffb3b3;border:1px solid rgba(255,93,93,.25)}
.note.ok{background:#0f2e1e;color:#9be8bd;border-color:rgba(43,212,125,.25)}.note a{color:#fff;text-decoration:underline;font-weight:700}

/* bottom nav */
.tabsrow{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(5,10,8,.92);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabsrow .wrap{display:grid;grid-template-columns:repeat(4,1fr)}
.tabsrow button{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 2px 11px;color:#7f968a;font-weight:500;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase}
.tabsrow button svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tabsrow button.on{color:var(--green)}
.tabsrow button.on::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 4px 4px;background:var(--green);box-shadow:0 0 12px var(--green)}

/* lists */
.sub{display:flex;justify-content:space-between;padding:18px 16px 10px;font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin:16px 12px 10px;padding:4px;border-radius:14px;background:#0a140f;border:1px solid var(--line)}
.seg button{padding:10px 4px;border-radius:10px;font-size:13.5px;font-weight:500;color:var(--muted)}
.seg button.on{background:var(--card2);color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.4)}
.seg b{display:inline-block;min-width:20px;margin-left:5px;padding:1px 6px;border-radius:99px;background:rgba(43,212,125,.16);color:var(--green);font-size:12px;font-weight:700}
.tk{margin:0 12px 10px;background:var(--card);border-radius:14px;padding:12px;border:1px solid var(--line)}
.tk .nm{color:#e8fff2;font-size:16px;font-weight:700;margin-bottom:9px;display:flex;align-items:center;gap:8px}
.tk .nm small{margin-left:auto;color:var(--green);font-size:12px;font-weight:700;background:rgba(43,212,125,.12);padding:3px 9px;border-radius:99px}
.slots{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.slot{aspect-ratio:1/1;border-radius:7px;background:#0a140f;border:1px dashed rgba(255,255,255,.07);display:flex;align-items:center;justify-content:center;font-size:clamp(11px,3.5vw,15px);font-weight:500;color:#cfe3d8}
.slot.f{background:#1d3128;border:1px solid var(--line)}
.slot.h{background:linear-gradient(160deg,#ffe27a,#f2a900);color:#3a2600;font-weight:800;border-color:transparent;box-shadow:0 0 10px rgba(255,210,74,.55)}
.tk .foot{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}
.tk .foot div{background:#0a140f;border-radius:10px;padding:10px 12px;font-size:15px;font-weight:500}
.tk .foot .st{text-align:right;color:var(--yellow);font-weight:700}
.tk .foot .st.w{color:var(--green)}.tk .foot .st.l{color:#7d8e86}
.empty{text-align:center;color:var(--muted);padding:34px 20px}
.res{margin:0 12px 10px;background:var(--card);border-radius:14px;padding:12px;border:1px solid var(--line)}
.res .t{color:var(--muted);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:9px}
.res .balls{display:flex;flex-wrap:wrap;gap:5px}.res .ball{width:30px;height:30px;font-size:12px}
.heat{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;padding:0 12px}
.heat div{aspect-ratio:1/1;border-radius:7px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:13px;font-weight:500}
.heat small{font-size:9px;opacity:.8}

/* dialogs */
.modalbg{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.72);backdrop-filter:blur(3px);display:flex;align-items:flex-end;justify-content:center;padding:0}
.modal{width:min(520px,100%);max-height:88vh;overflow:auto;background:linear-gradient(180deg,#152a20,#0f1c15);border-radius:22px 22px 0 0;padding:18px 16px calc(22px + env(safe-area-inset-bottom));border:1px solid var(--line);animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:0}}
.modal h3{font-size:21px;display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.modal h3 button{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.09);display:flex;align-items:center;justify-content:center}
.modal h3 button svg{width:16px;height:16px;stroke:#cfe3d8;stroke-width:2.6;fill:none;stroke-linecap:round}
.modal p,.modal li{color:#bcd0c5;font-size:15px;line-height:1.55}.modal ul{padding-left:18px}
.modal code{color:var(--green);word-break:break-all;font-size:13px}
.row{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid var(--line);font-size:16px}
.row:last-child{border-bottom:0}
.sw{width:48px;height:27px;border-radius:99px;background:#2a3b34;position:relative;flex:none;transition:background .18s}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:21px;height:21px;border-radius:50%;background:#9ab;transition:left .18s}
.sw.on{background:var(--green2)}.sw.on::after{left:24px;background:#fff}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.pills button{padding:8px 14px;border-radius:99px;background:rgba(255,255,255,.08);color:#bcd0c5;font-weight:500}
.pills button.on{background:var(--green2);color:#fff}
.pt{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.pt div{background:#0a140f;border-radius:10px;padding:10px 12px;display:flex;justify-content:space-between;font-size:15px}
.pt b{color:var(--yellow)}
.btn2{width:100%;padding:13px;border-radius:12px;background:var(--green2);font-weight:700;font-size:16px;margin-top:10px}
.btn2.g{background:rgba(255,255,255,.09);color:#cfe3d8}
.conn{position:fixed;left:50%;top:64px;transform:translateX(-50%);z-index:40;background:#3a1a1a;color:#ffb3b3;padding:6px 14px;border-radius:99px;font-size:13px;border:1px solid rgba(255,93,93,.3)}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--yellow);color:#3a2c00;padding:12px 18px;border-radius:14px;font-weight:700;z-index:80;max-width:90%;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.4)}
</style>
</head>
<body>
<div class="bar0"><span>Fast Keno</span><button class="x0" id="close" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>
<div class="wrap">
  <div id="authFail" class="empty" hidden>Please open this from the bot inside Telegram.</div>
  <div id="app">
    <div class="head">
      <div class="logo">FAST<b>KENO</b></div>
      <div class="pillrow"><span class="wi"><svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h13v4"/><path d="M3 7v11a2 2 0 0 0 2 2h14a1 1 0 0 0 1-1v-3"/><path d="M21 12v4h-4a2 2 0 0 1 0-4z"/></svg></span><div class="mid"><div class="bal"><span id="bal">0.00</span> <small>ETB</small></div><div class="id" id="pid">ID</div></div></div>
      <button class="ic" id="menuBtn" aria-label="Menu"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    </div>
    <div class="conn" id="conn" hidden>Connecting to the live draw…</div>

    <section id="vGame">
      <div class="status">
        <div><span class="live" id="phase">STARTING</span><small id="rid">&nbsp;</small></div>
        <div class="timer" id="timer">00:00</div>
        <div class="r"><button class="chip" id="payBtn" aria-label="Payouts" style="padding:10px"><svg viewBox="0 0 24 24" style="width:18px;height:18px"><path d="M4 6h16M4 12h16M4 18h10"/></svg></button></div>
        <div class="tbar"><i id="tbar"></i></div>
      </div>
      <div class="tray"><div class="tray-h"><span>Live draw</span><b id="drawCnt">0 / 20</b></div><div class="drawn" id="drawn"></div></div>
      <div class="picks">
        <div class="l"><b id="introP">Pick up to 10</b><span id="pkHint">Tap the numbers you want</span><div class="dots" id="dots"></div></div>
        <button class="chip" id="qpick"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 15.5-6.2L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15.5 6.2L3 16"/><path d="M3 21v-5h5"/></svg>Auto</button>
        <button class="chip" id="qclr">Clear</button>
      </div>
      <div class="grid" id="grid"></div>
      <div class="bet">
        <div class="betrow">
          <div class="stepbox"><button id="dec" aria-label="Less"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button><input id="stake" type="number" inputmode="decimal" step="0.01"><button id="inc" aria-label="More"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button></div>
          <button class="sq" id="x2">X2</button><button class="sq" id="max">MAX</button><button class="sq" id="gear" aria-label="Settings"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg></button>
        </div>
        <button class="betbtn" id="bet">BET</button>
      </div>
      <div id="msg"></div>
      <div class="seg" id="lt"><button data-l="all" class="on">All<b id="nAll">0</b></button><button data-l="mine">My Tickets<b id="nMine">0</b></button><button data-l="bets">My Bets<b id="nBets">0</b></button></div>
      <div id="list"></div>
    </section>

    <section id="vHist" hidden><div class="sub"><span>My bets</span></div><div id="histList"></div></section>
    <section id="vRes" hidden><div class="sub"><span>Latest draws</span></div><div id="resList"></div></section>
    <section id="vStat" hidden><div class="sub"><span id="statT">Statistics</span></div><div class="heat" id="heat"></div><p class="empty" id="statN"></p></section>
  </div>
</div>

<div class="tabsrow"><div class="wrap" id="tabs">
  <button data-t="game" class="on"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>Game</button>
  <button data-t="hist"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l3 2"/></svg>History</button>
  <button data-t="res"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m8.5 12.5 2.5 2.5 4.5-5"/></svg>Results</button>
  <button data-t="stat"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Stats</button>
</div></div>
<div id="modalHost"></div>

<script>
const API_URL = 'https://gmae-production-a450.up.railway.app';
const tg = window.Telegram && window.Telegram.WebApp;
const BOT = new URLSearchParams(location.search).get('b');
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fmt = (n) => Number(n || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const r2 = (n) => Math.round(Number(n) * 100) / 100;
const ls = (k, d) => { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (_) { return d; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (_) {} };

async function api(path, method = 'GET', body) {
  const ctl = new AbortController(); const timer = setTimeout(() => ctl.abort(), 20000); let res;
  try { res = await fetch(`${API_URL}${path}`, { method, headers: { 'Content-Type': 'application/json', Authorization: `tma ${tg.initData}` }, body: body ? JSON.stringify(body) : undefined, signal: ctl.signal }); }
  catch (e) { throw new Error(e && e.name === 'AbortError' ? 'The server is taking too long to answer. Please try again.' : 'Could not reach the server. Check your internet connection.'); }
  finally { clearTimeout(timer); }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || 'Something went wrong.');
  return data;
}
const pub = (path) => fetch(`${API_URL}${path}`).then((r) => r.json());
function toast(t) { const d = document.createElement('div'); d.className = 'toast'; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), 2600); }

/* ---------- small sounds ---------- */
let sfx = ls('kn_sfx', '1') === '1', actx = null;
function beep(f1, f2, d, v) {
  if (!sfx) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === 'suspended') actx.resume();
    const o = actx.createOscillator(), g = actx.createGain(), n = actx.currentTime;
    o.type = 'sine'; o.frequency.setValueAtTime(f1, n); o.frequency.exponentialRampToValueAtTime(Math.max(f2, 1), n + d);
    g.gain.setValueAtTime(v, n); g.gain.exponentialRampToValueAtTime(0.001, n + d); o.connect(g); g.connect(actx.destination); o.start(n); o.stop(n + d + .05);
  } catch (_) {}
}
const tick = () => beep(700, 520, .07, .08), win = () => { beep(660, 990, .18, .15); setTimeout(() => beep(990, 1320, .2, .12), 110); };

/* ---------- state ---------- */
const S = { phase: 'starting', offset: 0, endsAt: 0, hash: '', roundId: null, numbers: null, revealAt: 0, revealMs: 14000, results: [], live: [], count: 0, connected: false, lastRound: null };
const me = { balance: 0, min: 5, max: 1000, maxPayout: 20000, maxTickets: 5, paytable: {}, tickets: [], name: 'Player', enabled: true };
let picks = new Set(), stake = 5, tab = 'game', list = 'all', history = [], stats = null, repeatOn = ls('kn_repeat', '0') === '1', lastPicks = null, shown = 0, busy = false;
const serverNow = () => Date.now() + S.offset;
const sync = (d) => { if (d.now) S.offset = d.now - Date.now(); };
const ballClass = (n) => (n <= 20 ? 'b1' : n <= 40 ? 'b2' : n <= 60 ? 'b3' : 'b4');
const ball = (n, size) => `<span class="ball ${ballClass(n)}" style="width:${size}px;height:${size}px;font-size:${Math.round(size * .42)}px">${n}</span>`;
const myNums = () => { const s = new Set(); me.tickets.forEach((t) => t.picks.forEach((n) => s.add(n))); return s; };

/* ---------- grid ---------- */
function buildGrid() { $('grid').innerHTML = Array.from({ length: 80 }, (_, i) => `<button class="cell" data-n="${i + 1}">${i + 1}</button>`).join(''); }
function paintGrid() {
  const drawn = new Set((S.numbers || []).slice(0, shown)), mine = myNums(), hot = new Set(stats ? stats.hot.slice(0, 6) : []), cold = new Set(stats ? stats.cold.slice(0, 6) : []);
  const betting = S.phase === 'betting';
  $('grid').classList.toggle('off', !betting);
  $('grid').querySelectorAll('.cell').forEach((c) => {
    const n = Number(c.dataset.n), d = drawn.has(n), m = mine.has(n) && !betting;
    c.className = 'cell' + (betting && picks.has(n) ? ' sel' : '') + (d ? (m ? ' hit' : ' drawn') : (m ? ' mine' : ''));
    const mark = hot.has(n) ? 'hot' : cold.has(n) ? 'cold' : '';
    const i = c.querySelector('i'); if (mark && !i) c.insertAdjacentHTML('afterbegin', `<i class="${mark}"></i>`); else if (i && !mark) i.remove(); else if (i) i.className = mark;
  });
}
$('grid').onclick = (e) => {
  const c = e.target.closest('.cell'); if (!c || S.phase !== 'betting') return;
  const n = Number(c.dataset.n);
  if (picks.has(n)) picks.delete(n); else if (picks.size < 10) picks.add(n); else toast('You can choose up to 10 numbers.');
  paintGrid(); paintBet(); beep(520, 640, .05, .06);
};

$('qpick').onclick = () => {
  if (S.phase !== 'betting') return; const n = picks.size || 5; picks.clear();
  while (picks.size < n) picks.add(1 + Math.floor(Math.random() * 80));
  paintGrid(); paintBet(); beep(520, 640, .05, .06);
};
$('qclr').onclick = () => { if (S.phase !== 'betting') return; picks.clear(); paintGrid(); paintBet(); };

/* ---------- bet controls ---------- */
const setStake = (v) => { stake = Math.min(me.max, Math.max(me.min, r2(v))); $('stake').value = stake.toFixed(2); paintBet(); };
$('dec').onclick = () => setStake(stake - me.min);
$('inc').onclick = () => setStake(stake + me.min);
$('x2').onclick = () => setStake(stake * 2);
$('max').onclick = () => setStake(Math.min(me.max, Math.max(me.min, Math.floor(me.balance / me.min) * me.min)));
$('stake').oninput = () => { stake = Number($('stake').value) || 0; paintBet(); };
$('stake').onblur = () => setStake(stake || me.min);

function paintBet() {
  const b = $('bet'), bt = S.phase === 'betting';
  $('introP').textContent = picks.size ? `${picks.size} of 10 picked` : 'Pick up to 10';
  const topMult = picks.size && me.paytable[picks.size] ? me.paytable[picks.size][picks.size] : 0;
  $('pkHint').textContent = topMult ? `Match all ${picks.size} to win x${topMult}` : 'Tap the numbers you want';
  $('dots').innerHTML = Array.from({ length: 10 }, (_, i) => `<i class="${i < picks.size ? 'on' : ''}"></i>`).join('');
  $('qpick').disabled = $('qclr').disabled = !bt || !me.enabled;
  b.className = 'betbtn';
  if (!me.enabled) { b.disabled = true; b.textContent = 'KENO IS OFF'; return; }
  if (!bt) { b.disabled = true; b.textContent = S.phase === 'drawing' ? 'DRAWING…' : 'WAIT…'; return; }
  const full = me.tickets.length >= me.maxTickets;
  b.disabled = !picks.size || full;
  b.textContent = full ? `MAX ${me.maxTickets} TICKETS` : picks.size ? `BET ${fmt(stake)}` : 'CHOOSE NUMBERS';
}
function say(text, ok, dep) {
  $('msg').innerHTML = `<div class="note ${ok ? 'ok' : ''}">${esc(text)}${dep ? ` <a href="games?b=${encodeURIComponent(BOT)}#wallet">Deposit</a>` : ''}</div>`;
  clearTimeout(say.t); say.t = setTimeout(() => { $('msg').innerHTML = ''; }, 5000);
}
async function place(nums, st, silent) {
  if (busy) return; busy = true;
  try {
    const r = await api(`/api/mini/${BOT}/keno/bet`, 'POST', { picks: [...nums], stake: st });
    me.balance = r.balance; me.tickets.push(r.ticket); lastPicks = [...nums]; picks.clear();
    beep(440, 660, .08, .12); if (!silent) say(`Ticket placed — ${nums.length} numbers, ${fmt(st)} ETB.`, true);
  } catch (e) { say(e.message, false, /wallet|deposit/i.test(e.message)); }
  busy = false; paintAll();
}
$('bet').onclick = () => {
  if (S.phase !== 'betting') return;
  if (!picks.size) return;
  if (stake < me.min || stake > me.max) return say(`Bet between ${me.min} and ${me.max} ETB.`, false);
  place(picks, stake);
};
async function cancelTicket(id) {
  try { const r = await api(`/api/mini/${BOT}/keno/cancel`, 'POST', { id }); me.balance = r.balance; me.tickets = me.tickets.filter((t) => t.id !== id); } catch (e) { say(e.message, false); }
  paintAll();
}

/* ---------- lists ---------- */
function ticketHtml(t, name, drawnSet) {
  const slots = Array.from({ length: 10 }, (_, i) => {
    const n = t.picks[i]; if (n == null) return '<div class="slot"></div>';
    return `<div class="slot f${drawnSet && drawnSet.has(n) ? ' h' : ''}">${n}</div>`;
  }).join('');
  const st = t.status === 'won' ? `<div class="st w">Win +${fmt(t.payout)}</div>` : t.status === 'lost' ? '<div class="st l">No win</div>' : '<div class="st">Waiting</div>';
  return `<div class="tk"><div class="nm">${esc(name)}${t.hits != null ? `<small>${t.hits} hit${t.hits === 1 ? '' : 's'}</small>` : ''}</div><div class="slots">${slots}</div><div class="foot"><div>Bet ${fmt(t.stake)}</div>${st}</div></div>`;
}
function paintList() {
  const drawn = S.numbers && (S.phase === 'drawing' || S.phase === 'ended') ? new Set(S.numbers.slice(0, shown)) : null;
  $('nAll').textContent = S.count; $('nMine').textContent = me.tickets.length; $('nBets').textContent = history.length;
  document.querySelectorAll('#lt button').forEach((b) => b.classList.toggle('on', b.dataset.l === list));
  let html = '';
  if (list === 'all') html = S.live.map((t) => ticketHtml(t, t.name, drawn)).join('');
  else if (list === 'mine') html = me.tickets.map((t) => ticketHtml(t, me.name, drawn) + (S.phase === 'betting' && t.status === 'placed' ? `<button class="btn2 g" style="margin:-4px 10px 10px;width:calc(100% - 20px)" data-cancel="${t.id}">Cancel this ticket</button>` : '')).join('');
  else html = history.map((t) => ticketHtml({ ...t, picks: t.picks }, me.name, new Set(t.drawn))).join('');
  $('list').innerHTML = html || '<div class="empty">Nothing here yet.</div>';
}
$('lt').onclick = async (e) => { const b = e.target.closest('button[data-l]'); if (!b) return; list = b.dataset.l; if (list === 'bets') await loadHistory(); paintList(); };
$('list').onclick = (e) => { const b = e.target.closest('[data-cancel]'); if (b) cancelTicket(Number(b.dataset.cancel)); };

async function loadHistory() { try { history = (await api(`/api/mini/${BOT}/keno/history`)).tickets; } catch (_) {} }
function paintHistTab() { $('histList').innerHTML = history.length ? history.map((t) => ticketHtml(t, me.name, new Set(t.drawn))).join('') : '<div class="empty">No bets yet.</div>'; }
function paintResTab() {
  $('resList').innerHTML = S.results.length ? S.results.map((r, i) => `<div class="res"><div class="t">${i === 0 && S.phase !== 'betting' ? 'Latest draw' : `Draw ${i + 1} back`}</div><div class="balls">${r.numbers.map((n) => ball(n, 30)).join('')}</div></div>`).join('') : '<div class="empty">No draws yet.</div>';
}
function paintStatTab() {
  if (!stats) { $('heat').innerHTML = ''; $('statN').textContent = 'Loading…'; return; }
  const max = Math.max(1, ...stats.counts);
  $('statT').textContent = `How often each number came out (last ${stats.draws} draws)`;
  $('heat').innerHTML = stats.counts.map((c, i) => `<div style="background:rgba(43,212,125,${(0.08 + 0.7 * c / max).toFixed(2)})">${i + 1}<small>${c}</small></div>`).join('');
  $('statN').textContent = stats.hot.length ? `Hot: ${stats.hot.join(', ')}   ·   Cold: ${stats.cold.join(', ')}` : '';
}
$('tabs').onclick = async (e) => {
  const b = e.target.closest('button[data-t]'); if (!b) return; tab = b.dataset.t;
  document.querySelectorAll('#tabs button').forEach((x) => x.classList.toggle('on', x === b));
  ['Game', 'Hist', 'Res', 'Stat'].forEach((k) => { $('v' + k).hidden = k.toLowerCase() !== tab; });
  if (tab === 'hist') { await loadHistory(); paintHistTab(); }
  if (tab === 'res') paintResTab();
  if (tab === 'stat') { paintStatTab(); try { stats = await pub('/api/keno/stats'); paintStatTab(); paintGrid(); } catch (_) {} }
};

/* ---------- live ---------- */
function paintAll() { $('bal').textContent = fmt(me.balance); paintGrid(); paintBet(); paintList(); }
async function loadMe() {
  try {
    const m = await api(`/api/mini/${BOT}/keno/me`);
    Object.assign(me, { name: m.name, balance: m.balance, min: m.min, max: m.max, maxPayout: m.maxPayout, maxTickets: m.maxTickets, paytable: m.paytable, enabled: m.enabled, tickets: m.tickets || [] });
    if (stake < me.min) stake = me.min; $('stake').value = Number(stake).toFixed(2);
    paintAll();
  } catch (e) { say(e.message, false); }
}
function connect() {
  const es = new EventSource(`${API_URL}/api/keno/stream`);
  es.onopen = () => { S.connected = true; $('conn').hidden = true; };
  es.onerror = () => { S.connected = false; $('conn').hidden = false; };
  const apply = (d) => { if (d.results) S.results = d.results; if (d.tickets) { S.live = d.tickets; S.count = d.count; } };
  es.addEventListener('state', (e) => {
    const d = JSON.parse(e.data); sync(d); apply(d);
    Object.assign(S, { phase: d.phase, roundId: d.round_id || null, hash: d.server_seed_hash || '', endsAt: d.betting_ends_at || 0, numbers: d.numbers || null, revealAt: d.reveal_started_at || 0, revealMs: d.reveal_ms || 14000 });
    shown = d.phase === 'ended' && d.numbers ? 20 : 0; S.connected = true; $('conn').hidden = true; loadMe();
  });
  es.addEventListener('betting', async (e) => {
    const d = JSON.parse(e.data); sync(d); apply(d);
    Object.assign(S, { phase: 'betting', roundId: d.round_id, hash: d.server_seed_hash, endsAt: d.betting_ends_at, numbers: null }); shown = 0; S.live = []; S.count = 0; me.tickets = [];
    paintAll(); await loadMe();
    if (repeatOn && lastPicks && me.tickets.length < me.maxTickets && me.balance >= stake) place(lastPicks, stake, true);
  });
  es.addEventListener('draw', (e) => { const d = JSON.parse(e.data); sync(d); Object.assign(S, { phase: 'drawing', numbers: d.numbers, revealAt: d.reveal_started_at, revealMs: d.reveal_ms }); shown = 0; picks.clear(); paintAll(); });
  es.addEventListener('result', async (e) => {
    const d = JSON.parse(e.data); sync(d); apply(d); S.phase = 'ended'; S.numbers = d.numbers; S.lastRound = d.round_id; shown = 20;
    await loadMe(); const won = me.tickets.filter((t) => t.status === 'won'); const total = won.reduce((s, t) => s + t.payout, 0);
    if (total > 0) { win(); toast(`You won +${fmt(total)} ETB`); }
    loadHistory().then(paintList);
  });
  es.addEventListener('live', (e) => { const d = JSON.parse(e.data); S.live = d.tickets || []; S.count = d.count || 0; paintList(); });
}
function frame() {
  const t = $('timer');
  if (S.phase === 'betting') { const left = Math.max(0, Math.ceil((S.endsAt - serverNow()) / 1000)); t.textContent = `00:${String(Math.min(left, 99)).padStart(2, '0')}`; t.className = 'timer' + (left <= 5 ? ' go' : ''); }
  else { t.textContent = S.phase === 'drawing' ? 'DRAW' : '--:--'; t.className = 'timer go txt'; }
  if (S.phase === 'drawing' && S.numbers) {
    const n = Math.min(20, Math.floor((serverNow() - S.revealAt) / (S.revealMs / 20)) + 1);
    if (n > shown) { for (let i = shown; i < n; i++) tick(); shown = n; paintGrid(); paintList(); }
  }
  const dn = S.numbers && (S.phase === 'drawing' || S.phase === 'ended') ? S.numbers.slice(0, shown) : [];
  const key = dn.join(',');
  if (frame.k !== key) {
    frame.k = key;
    $('drawn').innerHTML = Array.from({ length: 20 }, (_, i) => (i < dn.length ? `<span class="ball ${ballClass(dn[i])} tb">${dn[i]}</span>` : '<span class="e"></span>')).join('');
    $('drawCnt').textContent = `${dn.length} / 20`;
  }
  const lab = S.phase === 'betting' ? ['BETTING', ''] : S.phase === 'drawing' ? ['DRAWING', 'warn'] : S.phase === 'ended' ? ['RESULT', 'warn'] : ['STARTING', 'warn'];
  if (frame.l !== lab[0]) { frame.l = lab[0]; $('phase').textContent = lab[0]; $('phase').className = 'live ' + lab[1]; }
  const rid = S.roundId ? `#${String(S.roundId).slice(-6)}` : '\u00a0';
  if (frame.r !== rid) { frame.r = rid; $('rid').textContent = rid; }
  let pct = 0;
  if (S.phase === 'betting') { if (frame.e !== S.endsAt) { frame.e = S.endsAt; frame.span = Math.max(S.endsAt - serverNow(), 40000); } pct = Math.max(0, Math.min(100, (S.endsAt - serverNow()) / frame.span * 100)); }
  else if (S.phase === 'drawing') pct = shown / 20 * 100;
  else if (S.phase === 'ended') pct = 100;
  $('tbar').style.width = pct.toFixed(1) + '%';
  requestAnimationFrame(frame);
}

/* ---------- menus ---------- */
function modal(html) {
  $('modalHost').innerHTML = `<div class="modalbg" id="mbg"><div class="modal">${html}</div></div>`;
  $('mbg').onclick = (e) => { if (e.target.id === 'mbg' || e.target.closest('[data-x]')) $('modalHost').innerHTML = ''; };
}
function payModal(k) {
  k = k || Math.max(1, picks.size) ; const pt = me.paytable[k] || {};
  modal(`<h3>Payouts <button data-x aria-label="Close"><svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button></h3><p style="margin-bottom:10px">Pick numbers, then win by how many of them are drawn. Payout = your bet × the multiplier.</p>
    <div class="pills" id="pp">${Array.from({ length: 10 }, (_, i) => `<button data-k="${i + 1}" class="${i + 1 === k ? 'on' : ''}">${i + 1}</button>`).join('')}</div>
    <div class="pt">${Object.keys(pt).map((h) => `<div><span>${h} hits</span><b>x${pt[h]}</b></div>`).join('') || '<p>No payout.</p>'}</div>
    <p style="margin-top:10px">One ticket can win at most ${fmt(me.maxPayout)} ETB.</p>`);
  $('pp').onclick = (e) => { const b = e.target.closest('button[data-k]'); if (b) payModal(Number(b.dataset.k)); };
}
$('payBtn').onclick = () => payModal();
$('gear').onclick = () => {
  modal(`<h3>Settings <button data-x aria-label="Close"><svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button></h3>
    <div class="pills" id="qp"><span style="color:var(--muted);align-self:center">Quick pick:</span>${[3, 5, 8, 10].map((n) => `<button data-q="${n}">${n}</button>`).join('')}<button data-q="0">Clear</button></div>
    <div class="row"><span>Repeat my last ticket every draw</span><span class="sw ${repeatOn ? 'on' : ''}" id="swR"></span></div>
    <div class="row"><span>Sound</span><span class="sw ${sfx ? 'on' : ''}" id="swS"></span></div>`);
  $('qp').onclick = (e) => {
    const b = e.target.closest('button[data-q]'); if (!b) return; const q = Number(b.dataset.q); picks.clear();
    if (q) { while (picks.size < q) picks.add(1 + Math.floor(Math.random() * 80)); }
    paintGrid(); paintBet(); $('modalHost').innerHTML = '';
  };
  $('swR').onclick = () => { repeatOn = !repeatOn; lsSet('kn_repeat', repeatOn ? '1' : '0'); $('swR').classList.toggle('on', repeatOn); };
  $('swS').onclick = () => { sfx = !sfx; lsSet('kn_sfx', sfx ? '1' : '0'); $('swS').classList.toggle('on', sfx); };
};
$('menuBtn').onclick = () => modal(`<h3>Fast Keno <button data-x aria-label="Close"><svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button></h3>
  <div class="row" data-m="pay" style="cursor:pointer"><span>Payouts</span><span>›</span></div>
  <div class="row" data-m="how" style="cursor:pointer"><span>How to play</span><span>›</span></div>
  <div class="row" data-m="fair" style="cursor:pointer"><span>Provably fair</span><span>›</span></div>
  <div class="row" data-m="games" style="cursor:pointer"><span>Back to games</span><span>›</span></div>`);
$('modalHost').addEventListener('click', async (e) => {
  const r = e.target.closest('[data-m]'); if (!r) return; const k = r.dataset.m;
  if (k === 'pay') payModal();
  if (k === 'games') goGames();
  if (k === 'how') modal('<h3>How to play <button data-x aria-label="Close"><svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button></h3><ul><li>Choose 1 to 10 numbers from 1 to 80 before the timer ends.</li><li>Pick your bet and press BET. You can play up to 5 tickets per draw.</li><li>20 numbers are drawn. The more of your numbers are drawn, the bigger the win.</li><li>Red dots mark numbers that came out often lately, blue dots mark numbers that came out rarely.</li><li>Payouts never go above what the platform can afford; a draw limited for that reason is marked when you verify it.</li></ul>');
  if (k === 'fair') {
    let extra = ''; if (S.lastRound) { try { const v = await pub(`/api/keno/verify/${encodeURIComponent(S.lastRound)}`); extra = v.error ? `<p>${esc(v.error)}</p>` : `<p style="margin-top:10px">Last draw: hash matches seed — <b>${v.hash_matches ? 'YES' : 'NO'}</b><br>Seed used with nonce <b>${v.nonce}</b>${v.limited ? ' (limited to platform funds)' : ''}.</p>`; } catch (_) {} }
    modal(`<h3>Provably fair <button data-x aria-label="Close"><svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button></h3><p>Before betting starts, a secret seed is chosen and its hash is shown. After the draw the seed is revealed so anyone can check the numbers.</p><p style="margin-top:10px">Current hash:<br><code>${esc(S.hash || '…')}</code></p>${extra}`);
  }
});
const goGames = (h) => { location.href = `games?b=${encodeURIComponent(BOT)}${h || ''}`; };
$('close').onclick = () => goGames();

(function init() {
  if (!tg || !tg.initData || !BOT) { $('authFail').hidden = false; $('app').hidden = true; return; }
  tg.ready(); tg.expand();
  const u = tg.initDataUnsafe && tg.initDataUnsafe.user; $('pid').textContent = `ID: ${u ? u.id : ''}`;
  buildGrid(); stake = Number(ls('kn_stake', '5')) || 5; $('stake').value = stake.toFixed(2); paintAll();
  pub('/api/keno/stats').then((s) => { stats = s; paintGrid(); }).catch(() => {});
  connect(); requestAnimationFrame(frame);
  window.addEventListener('beforeunload', () => lsSet('kn_stake', String(stake)));
})();
</script>
