<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Bingo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --pitch:#0D3B2C; --turf:#17694B; --turf-2:#1E7C58; --chalk:#EEF3F0; --paper:#FFFFFF;
    --ink:#0B1B15; --muted:#587066; --line:#D3DFD8; --flood:#FFCE2E; --flood-ink:#3A2C00; --red:#D9453B; --redsoft:#FBE6E3;
    --blue:#2F63D8; --green:#1E9E5A; --purple:#8A4FD1; --goldc:#C98F1F;
    --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
    --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{background:var(--chalk);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;user-select:none}
  body{min-height:100vh;padding-bottom:30px}
  button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
  #app{width:min(640px,100%);margin:0 auto;min-height:100vh;display:flex;flex-direction:column}

  /* header — same as the store and Aviator */
  .top{background:var(--pitch);color:#fff;position:sticky;top:0;z-index:20;overflow:hidden}
  .top::after{content:"";position:absolute;right:-46px;top:-60px;width:170px;height:170px;border-radius:50%;border:2px solid rgba(255,255,255,.12);pointer-events:none}
  .top::before{content:"";position:absolute;right:-6px;top:-26px;width:90px;height:90px;border-radius:50%;border:2px solid rgba(255,255,255,.1);pointer-events:none}
  .top-in{padding:14px 16px 16px;position:relative;z-index:1}
  .bar{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .logo{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:25px;letter-spacing:.01em;min-width:0}
  .logo svg{width:30px;height:30px;flex:none}
  .logo span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pill{background:rgba(255,255,255,.14);padding:7px 13px;border-radius:999px;font-weight:700;font-size:13px;color:#fff;white-space:nowrap}
  .seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:rgba(0,0,0,.28);border-radius:14px;padding:4px;margin-top:12px}
  .seg button{padding:9px 6px;border-radius:10px;font-weight:700;font-size:14px;color:#BFD4C9;text-align:center}
  .seg button[aria-pressed=true]{background:var(--flood);color:var(--flood-ink)}

  .stat-row{display:flex;gap:10px;padding:16px 16px 12px}
  .stat{flex:1;background:var(--paper);border-radius:16px;padding:10px 6px;text-align:center;border:1px solid var(--line)}
  .stat.active{background:var(--flood);border-color:var(--flood);color:var(--flood-ink)}
  .stat.balance{background:var(--pitch);border-color:var(--pitch);color:#fff}
  .stat label{display:block;font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
  .stat.balance label{color:#BFD4C9}.stat.active label{color:#6A4F00}
  .stat strong{font-family:var(--display);font-size:22px;font-weight:800;line-height:1.2}

  .stake-row{display:flex;gap:8px;padding:0 16px 12px;flex-wrap:wrap}
  .stake-chip{padding:7px 15px;border-radius:999px;border:1.5px solid var(--line);background:var(--paper);color:var(--muted);font-size:13.5px;font-weight:700}
  .stake-chip.active{border-color:var(--turf);color:var(--turf);background:#E4F2EB}

  .msg{margin:0 16px 12px;padding:11px 13px;border-radius:12px;font-size:14px}
  .msg.error{background:var(--redsoft);color:#8E2A22}
  .msg.info{background:#E1EEE7;color:#0F4B35}

  .picker-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:7px;padding:0 16px 16px;flex:1;align-content:start}
  .picker-cell{aspect-ratio:1;border-radius:50%;background:var(--paper);border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12.5px;color:var(--ink)}
  .picker-cell.taken{background:#DCE4DF;color:#9BAAA2;border-color:#DCE4DF}
  .picker-cell.selected{background:var(--flood);color:var(--flood-ink);border-color:var(--flood);box-shadow:0 6px 12px -6px rgba(255,206,46,.9)}

  .play-btn{margin:0 16px 20px;padding:15px;border:none;border-radius:14px;background:var(--flood);color:var(--flood-ink);font-weight:800;font-size:16px;box-shadow:0 8px 16px -8px rgba(255,206,46,.8)}
  .play-btn:disabled{background:#DCE4DF;color:#8DA096;box-shadow:none}

  .game-top{display:flex;gap:16px;padding:16px;align-items:center}
  .game-stat label{display:block;font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
  .game-stat strong{font-family:var(--display);font-size:24px;font-weight:800}
  .game-stat.derash strong{color:var(--green)}
  .game-stat.players strong{color:var(--turf)}
  .called-ball{margin-left:auto;width:66px;height:66px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:900;font-size:20px;color:#fff;border:4px solid #fff;background:var(--pitch);box-shadow:0 8px 16px -6px rgba(0,0,0,.4)}
  .recent-balls{display:flex;gap:8px;padding:0 16px 12px;overflow-x:auto}
  .mini-ball{width:32px;height:32px;flex-shrink:0;border-radius:50%;background:#555;color:#fff;display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:800}

  .game-body{display:flex;gap:10px;padding:0 16px;flex:1}
  .board{flex:1;display:grid;grid-template-columns:repeat(5,1fr);gap:3px;align-content:start;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:6px}
  .board .bhead{text-align:center;padding:5px 0;font-weight:800;border-radius:6px;color:#fff;font-size:12px}
  .board .bnum{aspect-ratio:1;background:#F3F7F5;color:var(--ink);display:flex;align-items:center;justify-content:center;font-size:11px;border-radius:5px;font-weight:600}
  .board .bnum.marked{background:var(--pitch);color:#9FC4B3}

  .mycard-wrap{flex:1;display:flex;flex-direction:column}
  .mycard{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:8px}
  .mycard .chead{text-align:center;padding:6px 0;font-weight:800;border-radius:7px;color:#fff;font-size:13px}
  .mycard .ccell{aspect-ratio:1;background:#F3F7F5;color:var(--ink);display:flex;align-items:center;justify-content:center;font-size:13px;border-radius:7px;font-weight:700}
  .mycard .ccell.marked{background:var(--turf);color:#fff}
  .mycard .ccell.free{background:var(--flood);color:var(--flood-ink)}

  .bingo-btn{margin-top:auto;padding:15px;border:none;border-radius:14px;background:var(--turf);color:#fff;font-weight:800;font-size:16px;width:100%;box-shadow:0 8px 16px -8px rgba(23,105,75,.7)}
  .bingo-btn:disabled{background:#DCE4DF;color:#8DA096;box-shadow:none}

  .waiting-banner{margin:16px 16px 12px;padding:14px;border-radius:14px;background:var(--flood);color:var(--flood-ink);text-align:center;font-weight:800;font-size:14px}

  .col-B{background:var(--blue)} .col-I{background:var(--red)}
  .col-N{background:var(--goldc)} .col-G{background:var(--green)}
  .col-O{background:var(--purple)}
  .hidden{display:none !important}

  .toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:14px;font-weight:700;z-index:50;box-shadow:0 8px 24px rgba(0,0,0,.3);text-align:center;max-width:90%}
  .center-msg{flex:1;display:flex;align-items:center;justify-content:center;color:var(--muted);padding:28px 20px;text-align:center}

  .winner-overlay{position:fixed;inset:0;background:rgba(5,25,18,.82);z-index:100;display:flex;align-items:center;justify-content:center;padding:24px}
  .winner-box{width:100%;max-width:340px;background:var(--paper);border-radius:24px;padding:28px 20px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.4);position:relative;overflow:hidden}
  .winner-box::before{content:"";position:absolute;left:0;right:0;top:0;height:8px;background:var(--flood)}
  .winner-box .w-title{font-family:var(--display);font-size:46px;font-weight:900;color:var(--turf);letter-spacing:.02em;margin-bottom:10px;line-height:1}
  .winner-box .w-user{font-size:20px;font-weight:800;margin-bottom:6px;word-break:break-all}
  .winner-box .w-card{font-size:15px;color:var(--muted);margin-bottom:10px}
  .winner-box .w-card b{color:var(--ink)}
  .winner-box .w-prize{font-family:var(--display);font-size:34px;font-weight:900;color:var(--goldc)}
</style>
</head>
<body>
<div id="app">
  <header class="top"><div class="top-in">
    <div class="bar">
      <div class="logo">
        <svg viewBox="0 0 32 32" fill="none"><circle cx="16" cy="16" r="15" fill="#fff"/><circle cx="16" cy="16" r="7" fill="#0D3B2C"/><circle cx="16" cy="16" r="3" fill="#FFCE2E"/></svg>
        <span id="gameTitle">BINGO</span>
      </div>
      <button class="pill" id="walletBtn">💰 Wallet</button>
    </div>
    <div class="seg" id="tabs">
      <button data-go="games">🎮 Games</button>
      <button aria-pressed="true">🎯 Bingo</button>
      <button data-go="wallet">💰 Wallet</button>
      <button data-go="admin" id="adminTab" hidden>🛠 Admin</button>
    </div>
  </div></header>

  <div id="authFail" class="center-msg hidden">Please open this from the bot inside Telegram.</div>

  <div id="lobby" class="hidden">
    <div class="stat-row">
      <div class="stat active"><label>Stake</label><strong id="stakeLabel">-</strong></div>
      <div class="stat"><label>Sold</label><strong id="soldCount">0</strong></div>
      <div class="stat balance"><label>Balance</label><strong id="balanceLabel">0 ETB</strong></div>
    </div>
    <div class="stake-row" id="stakeRow"></div>
    <div id="lobbyMsg"></div>
    <div class="picker-grid" id="pickerGrid"></div>
    <button class="play-btn" id="playBtn" disabled>SELECT A CARD TO PLAY</button>
  </div>

  <div id="waitingScreen" class="hidden">
    <div class="waiting-banner" id="waitingBanner">Waiting for round to start...</div>
    <div class="center-msg">Your card is locked in. The round starts automatically once the timer ends.</div>
  </div>

  <div id="gameScreen" class="hidden">
    <div class="game-top">
      <div class="game-stat derash"><label>Pool</label><strong id="derash">0 ETB</strong></div>
      <div class="game-stat"><label>Balls</label><strong id="ballsCount">0/75</strong></div>
      <div class="game-stat players"><label>Players</label><strong id="playersCount">0</strong></div>
      <div class="called-ball" id="calledBall">--</div>
    </div>
    <div class="recent-balls" id="recentBalls"></div>
    <div class="game-body">
      <div class="board" id="board"></div>
      <div class="mycard-wrap">
        <div class="mycard" id="mycard"></div>
        <button class="bingo-btn" id="bingoBtn" disabled>BINGO!</button>
      </div>
    </div>
  </div>
</div>

<script>
const API_URL = 'https://gmae-production-aa21.up.railway.app'; // same backend as app.html
const tg = window.Telegram && window.Telegram.WebApp;
const BOT = new URLSearchParams(location.search).get('b');
const $ = (id) => document.getElementById(id);
const COLS = ['B','I','N','G','O'];
const colColor = {B:'col-B', I:'col-I', N:'col-N', G:'col-G', O:'col-O'};
const bgMap = {B:'#3b6df0', I:'#e0453f', N:'#c98f1f', G:'#3fbf5f', O:'#9b5de5'};

let selectedStake = null;
let selectedCard = null;
let currentRoundId = null;
let pollTimer = null;

async function api(path, method = 'GET', body) {
  const ctl = new AbortController(); const timer = setTimeout(() => ctl.abort(), 20000);
  let res;
  try {
    res = await fetch(`${API_URL}${path}`, {
      method,
      headers: { 'Content-Type': 'application/json', Authorization: `tma ${tg.initData}` },
      body: body ? JSON.stringify(body) : undefined, signal: ctl.signal,
    });
  } catch (e) {
    throw new Error(e && e.name === 'AbortError' ? 'The server is taking too long to answer.' : 'Could not reach the server. Check your internet connection.');
  } finally { clearTimeout(timer); }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || 'Something went wrong.');
  return data;
}

function colOf(n){
  if(n<=15) return 'B'; if(n<=30) return 'I'; if(n<=45) return 'N'; if(n<=60) return 'G'; return 'O';
}

function showLobbyMsg(text, type='error'){
  $('lobbyMsg').innerHTML = `<div class="msg ${type}">${text}</div>`;
}
function clearLobbyMsg(){ $('lobbyMsg').innerHTML = ''; }

function showToast(msg){
  const t = document.createElement('div');
  t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3500);
}

/* ---------------- WINNER ANNOUNCEMENT ---------------- */

const announcedRounds = new Set(); // never show the same round's result twice

// Shows "BINGO!" + winner username + winning card for exactly 3 seconds.
// Called from every poll, so all players see it whichever screen they're on.
function maybeShowWinner(result){
  if(!result || !result.winner || announcedRounds.has(result.roundId)) return;
  announcedRounds.add(result.roundId);

  const w = result.winner;
  const who = w.username || w.name || ('Player ' + w.telegramId);
  const isMe = String(w.telegramId) === String(window.__myId);

  const el = document.createElement('div');
  el.className = 'winner-overlay';
  el.innerHTML = `
    <div class="winner-box">
      <div class="w-title">BINGO!</div>
      <div class="w-user">${isMe ? 'You won! 🎉' : esc(who)}</div>
      ${isMe ? `<div class="w-card">${esc(who)}</div>` : ''}
      <div class="w-card">Won with card <b>#${esc(w.cardNo ?? '?')}</b></div>
      <div class="w-prize">${esc(result.prize)} ETB</div>
    </div>`;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 3000);
}

/* ---------------- LOBBY ---------------- */

async function loadLobby(){
  try{
    const s = await api(`/api/mini/${BOT}/bingo/state?stake=${selectedStake || ''}`);
    maybeShowWinner(s.result);
    $('gameTitle').innerHTML = `<span>${esc(s.name).toUpperCase()}</span>`;
    $('balanceLabel').textContent = s.balance.toFixed(2) + ' ETB';

    if(!selectedStake) selectedStake = s.stake;
    renderStakeRow(s.stakes);
    $('stakeLabel').textContent = selectedStake + ' ETB';

    if(s.round && s.myCard){
      // already joined this stake's open round
      currentRoundId = s.round.id;
      if(s.round.status === 'waiting'){
        showWaiting();
      } else {
        enterGame(s);
      }
      return;
    }

    $('lobby').classList.remove('hidden');
    $('waitingScreen').classList.add('hidden');
    $('gameScreen').classList.add('hidden');
    $('soldCount').textContent = s.round ? s.round.sold : 0;

    const taken = await api(`/api/mini/${BOT}/bingo/taken-cards?stake=${selectedStake}`);
    renderPicker(taken.taken || []);
  }catch(e){
    showLobbyMsg(esc(e.message) + ' <a href="#" id="retryLobby" style="font-weight:800;text-decoration:underline">Retry</a>');
    const r = $('retryLobby'); if (r) r.onclick = (ev) => { ev.preventDefault(); loadLobby(); };
  }
}

function renderStakeRow(stakes){
  $('stakeRow').innerHTML = stakes.map(st => `
    <div class="stake-chip ${st === selectedStake ? 'active' : ''}" data-stake="${st}">${st} ETB</div>
  `).join('');
  $('stakeRow').querySelectorAll('.stake-chip').forEach(el => {
    el.onclick = () => {
      selectedStake = Number(el.dataset.stake);
      selectedCard = null;
      loadLobby();
    };
  });
}

function renderPicker(taken){
  const grid = $('pickerGrid');
  const takenSet = new Set(taken);
  let html = '';
  for(let i=1;i<=100;i++){
    const cls = takenSet.has(i) ? 'taken' : (selectedCard === i ? 'selected' : '');
    html += `<div class="picker-cell ${cls}" data-n="${i}">${i}</div>`;
  }
  grid.innerHTML = html;
  grid.querySelectorAll('.picker-cell').forEach(cell => {
    cell.onclick = () => {
      if(cell.classList.contains('taken')) return;
      const n = Number(cell.dataset.n);
      selectedCard = (selectedCard === n) ? null : n;
      renderPicker(taken);
      updatePlayBtn();
    };
  });
}

function updatePlayBtn(){
  const btn = $('playBtn');
  if(selectedCard){
    btn.disabled = false;
    btn.textContent = `PLAY CARD #${selectedCard} — ${selectedStake} ETB`;
  } else {
    btn.disabled = true;
    btn.textContent = 'SELECT A CARD TO PLAY';
  }
}

$('playBtn').onclick = async () => {
  if(!selectedCard) return;
  clearLobbyMsg();
  $('playBtn').disabled = true;
  try{
    const r = await api(`/api/mini/${BOT}/bingo/join`, 'POST', { stake: selectedStake, cardNo: selectedCard });
    currentRoundId = r.roundId;
    $('balanceLabel').textContent = Number(r.newBalance).toFixed(2) + ' ETB';
    showWaiting();
  }catch(e){
    showLobbyMsg(e.message);
    $('playBtn').disabled = false;
  }
};

function showWaiting(){
  $('lobby').classList.add('hidden');
  $('gameScreen').classList.add('hidden');
  $('waitingScreen').classList.remove('hidden');
  pollForStart();
}

function pollForStart(){
  clearInterval(pollTimer);
  pollTimer = setInterval(async () => {
    try{
      const s = await api(`/api/mini/${BOT}/bingo/state?stake=${selectedStake}`);
      maybeShowWinner(s.result);
      if(s.round && s.round.status === 'playing'){
        clearInterval(pollTimer);
        enterGame(s);
      } else if(!s.round){
        // round vanished (no one joined / edge case) — back to lobby
        clearInterval(pollTimer);
        selectedCard = null;
        loadLobby();
      }
    }catch(e){ /* keep polling silently */ }
  }, 2000);
}

/* ---------------- GAME ---------------- */

function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function buildBoard(){
  const board = $('board');
  let html = '';
  COLS.forEach(c => html += `<div class="bhead ${colColor[c]}">${c}</div>`);
  const ranges = {B:[1,15],I:[16,30],N:[31,45],G:[46,60],O:[61,75]};
  for(let r=0;r<15;r++){
    COLS.forEach(c => {
      const num = ranges[c][0] + r;
      html += `<div class="bnum" id="board-${num}">${num}</div>`;
    });
  }
  board.innerHTML = html;
}

function renderMyCard(numbers, marked){
  const el = $('mycard');
  let html = '';
  COLS.forEach(c => html += `<div class="chead ${colColor[c]}">${c}</div>`);
  for(let i=0;i<25;i++){
    const n = numbers[i];
    if(n === 0){
      html += `<div class="ccell free">&#9733;</div>`;
    } else {
      html += `<div class="ccell ${marked[i] ? 'marked' : ''}">${n}</div>`;
    }
  }
  el.innerHTML = html;
}

function enterGame(s){
  $('lobby').classList.add('hidden');
  $('waitingScreen').classList.add('hidden');
  $('gameScreen').classList.remove('hidden');
  clearInterval(pollTimer);

  buildBoard();
  renderRoundState(s);
  pollGame();
}

function renderRoundState(s){
  const round = s.round;
  $('derash').textContent = round.pool + ' ETB';
  $('playersCount').textContent = round.players;
  $('ballsCount').textContent = round.calledNumbers.length + '/75';

  document.querySelectorAll('.bnum.marked').forEach(el => el.classList.remove('marked'));
  round.calledNumbers.forEach(n => {
    const cell = document.getElementById('board-' + n);
    if(cell) cell.classList.add('marked');
  });

  if(round.calledNumbers.length){
    const last = round.calledNumbers[round.calledNumbers.length - 1];
    const col = colOf(last);
    $('calledBall').textContent = col + '-' + last;
    $('calledBall').style.background = bgMap[col];
  }

  $('recentBalls').innerHTML = [...round.calledNumbers].reverse().slice(0,10).map(n => {
    const col = colOf(n);
    return `<div class="mini-ball" style="background:${bgMap[col]}">${n}</div>`;
  }).join('');

  if(s.myCard){
    renderMyCard(s.myCard.numbers, s.myCard.marked);
    const calledSet = new Set(round.calledNumbers);
    const marked = s.myCard.numbers.map(n => n === 0 || calledSet.has(n));
    $('bingoBtn').disabled = s.myCard.won || !checkWinClient(s.myCard.numbers, marked);
  }

  if(round.status === 'finished'){
    clearInterval(pollTimer);
    if(round.winnerTelegramId){
      showToast(round.winnerTelegramId === (window.__myId) ? 'You won this round!' : 'Round ended — better luck next time!');
    }
    setTimeout(() => { selectedCard = null; loadLobby(); }, 3000);
  }
}

function checkWinClient(numbers, marked){
  const at = (r,c) => marked[r*5+c];
  for(let r=0;r<5;r++) if([0,1,2,3,4].every(c=>at(r,c))) return true;
  for(let c=0;c<5;c++) if([0,1,2,3,4].every(r=>at(r,c))) return true;
  if([0,1,2,3,4].every(i=>at(i,i))) return true;
  if([0,1,2,3,4].every(i=>at(i,4-i))) return true;
  return false;
}

function pollGame(){
  clearInterval(pollTimer);
  pollTimer = setInterval(async () => {
    try{
      const s = await api(`/api/mini/${BOT}/bingo/state?stake=${selectedStake}`);
      maybeShowWinner(s.result);
      if(!s.round){ clearInterval(pollTimer); selectedCard = null; loadLobby(); return; }
      renderRoundState(s);
    }catch(e){ /* keep polling */ }
  }, 2500);
}

$('bingoBtn').onclick = async () => {
  if(!currentRoundId) return;
  $('bingoBtn').disabled = true;
  try{
    await api(`/api/mini/${BOT}/bingo/claim`, 'POST', { roundId: currentRoundId });
    clearInterval(pollTimer);
    // loadLobby reads the state, which now carries the winner result and
    // triggers the shared 3-second announcement.
    selectedCard = null;
    loadLobby();
  }catch(e){
    showLobbyMsg(e.message);
    $('bingoBtn').disabled = false;
  }
};

const goGames = (hash) => { location.href = `games?b=${encodeURIComponent(BOT)}${hash || ''}`; };
$('walletBtn').onclick = () => goGames('#wallet');
$('tabs').onclick = (e) => {
  const b = e.target.closest('button[data-go]'); if (!b) return;
  goGames(b.dataset.go === 'wallet' ? '#wallet' : b.dataset.go === 'admin' ? '#admin' : '');
};

(async function init(){
  if(!tg || !tg.initData || !BOT){
    $('authFail').classList.remove('hidden');
    return;
  }
  tg.ready(); tg.expand();
  window.__myId = tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.id;
  $('lobby').classList.remove('hidden');
  $('pickerGrid').innerHTML = '<div class="center-msg" style="grid-column:1/-1">Loading cards…</div>';
  loadLobby();
  api(`/api/mini/${BOT}/gadmin/me`).then((r) => { if (r.is_admin) $('adminTab').hidden = false; }).catch(() => {});
})();
</script>
</body>
</html>
