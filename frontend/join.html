<html lang="am">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Rewards</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#f1f6f3;--card:#fff;--card2:#e9f1ec;--ink:#10231a;--mut:#5d7468;--line:rgba(16,35,26,.1);--g:#17a35e;--g2:#0f7a45;--gold:#f2a900;--red:#d93c3c;--blue:#2f7bf0;--sh:0 6px 24px rgba(16,60,35,.08);--hero:linear-gradient(150deg,#0f7a45,#17a35e 60%,#43c985)}
[data-theme=dark]{--bg:#07110d;--card:#101e17;--card2:#16281f;--ink:#ecf7f0;--mut:#86a093;--line:rgba(255,255,255,.08);--g:#2bd47d;--g2:#17a35e;--gold:#ffd24a;--red:#ff6b6b;--blue:#5aa2ff;--sh:0 6px 24px rgba(0,0,0,.35);--hero:linear-gradient(150deg,#0d3b27,#13744a 65%,#1f9a62)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;padding-bottom:92px}
button,input,select,textarea{font:inherit;color:inherit}button{border:0;background:none;cursor:pointer}
.i{width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.2em;flex:none}
.wrap{width:min(680px,100%);margin:0 auto;padding:0 14px}
header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;gap:10px;padding-top:10px;padding-bottom:10px}
.av{width:40px;height:40px;border-radius:50%;background:var(--hero);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;flex:none}
.hd{flex:1;min-width:0}.hd b{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hd small{color:var(--mut);font-size:12px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-weight:700;font-size:13px}
.pill.tap{cursor:pointer}.pill.tap:active{transform:scale(.96)}
main{padding-top:14px;animation:fade .25s ease-out}@keyframes fade{from{opacity:0;transform:translateY(6px)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:var(--sh)}
.card h3{font-size:15px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.hero{background:var(--hero);color:#fff;border-radius:22px;padding:18px;margin-bottom:12px;position:relative;overflow:hidden;box-shadow:var(--sh)}
.hero::after{content:"";position:absolute;right:-50px;top:-50px;width:190px;height:190px;border-radius:50%;background:rgba(255,255,255,.1)}
.hero small{opacity:.85;font-size:13px}.hero .big{font-size:38px;font-weight:800;letter-spacing:-.5px;margin:2px 0 12px}.hero .big span{font-size:16px;font-weight:600;opacity:.85}
.hero .row{display:flex;gap:10px;position:relative;z-index:1}.hero .row>div{flex:1;background:rgba(255,255,255,.14);border-radius:14px;padding:9px 11px;font-size:12px}.hero .row b{display:block;font-size:16px}
.acts{display:flex;gap:8px;margin-top:12px;position:relative;z-index:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:12px 16px;border-radius:14px;background:var(--g);color:#fff;font-weight:700;font-size:15px;width:100%;box-shadow:0 4px 0 var(--g2)}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 var(--g2)}.btn:disabled{opacity:.5}
.btn.ghost{background:var(--card2);color:var(--ink);box-shadow:none}.btn.white{background:#fff;color:#0f7a45;box-shadow:none}.btn.red{background:var(--red);box-shadow:0 4px 0 #9b2323}.btn.sm{padding:8px 12px;font-size:13px;width:auto;border-radius:11px;box-shadow:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px}.stat small{color:var(--mut);font-size:12px;display:flex;gap:6px;align-items:center}.stat b{display:block;font-size:20px;margin-top:4px}
.mut{color:var(--mut)}.ok{color:var(--g)}.bad{color:var(--red)}.gold{color:var(--gold)}
.row2{display:flex;align-items:center;gap:10px}.row2>.grow{flex:1;min-width:0}
.item{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}.item:last-child{border:0;padding-bottom:0}.item:first-child{padding-top:0}
.ic{width:42px;height:42px;border-radius:13px;background:var(--card2);color:var(--g);display:flex;align-items:center;justify-content:center;font-size:20px;flex:none}
.item b{display:block;font-size:15px}.item small{color:var(--mut);font-size:12.5px;display:block;margin-top:2px}
.rw{font-weight:800;color:var(--g);white-space:nowrap}.rw.neg{color:var(--red)}
.chip{display:inline-block;padding:3px 9px;border-radius:99px;font-size:11.5px;font-weight:700;background:var(--card2);color:var(--mut)}
.chip.g{background:color-mix(in srgb,var(--g) 16%,transparent);color:var(--g)}.chip.y{background:color-mix(in srgb,var(--gold) 20%,transparent);color:var(--gold)}.chip.r{background:color-mix(in srgb,var(--red) 16%,transparent);color:var(--red)}.chip.b{background:color-mix(in srgb,var(--blue) 16%,transparent);color:var(--blue)}
.seg{display:flex;gap:4px;padding:4px;background:var(--card2);border-radius:14px;margin-bottom:12px;overflow-x:auto}.seg button{flex:1;white-space:nowrap;padding:9px 12px;border-radius:11px;font-weight:600;font-size:13.5px;color:var(--mut)}.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--sh)}
.banner{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:16px;margin-bottom:12px;font-size:14px;background:color-mix(in srgb,var(--gold) 16%,var(--card));border:1px solid color-mix(in srgb,var(--gold) 35%,transparent)}
.banner.g{background:color-mix(in srgb,var(--g) 12%,var(--card));border-color:color-mix(in srgb,var(--g) 30%,transparent)}.banner.r{background:color-mix(in srgb,var(--red) 12%,var(--card));border-color:color-mix(in srgb,var(--red) 30%,transparent)}
label{display:block;font-size:12.5px;font-weight:600;color:var(--mut);margin:12px 0 5px}label:first-child{margin-top:0}
input,select,textarea{width:100%;padding:12px 13px;border-radius:13px;border:1px solid var(--line);background:var(--card2);outline:none;font-size:15px}input:focus,select:focus,textarea:focus{border-color:var(--g)}textarea{min-height:84px;resize:vertical}
.hint{font-size:12px;color:var(--mut);margin-top:4px}
.tg{display:flex;justify-content:space-between;align-items:center;padding:8px 0}.sw{width:48px;height:28px;border-radius:99px;background:var(--card2);border:1px solid var(--line);position:relative;flex:none}.sw::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:var(--mut);transition:.18s}.sw[aria-pressed=true]{background:var(--g)}.sw[aria-pressed=true]::after{left:23px;background:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chips button{padding:8px 13px;border-radius:99px;background:var(--card2);font-weight:600;font-size:13.5px;border:1px solid var(--line)}.chips button[aria-pressed=true]{background:var(--g);color:#fff;border-color:transparent}
.bar{height:8px;background:var(--card2);border-radius:99px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--g2),var(--g));border-radius:99px}
nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav .wrap{display:grid;grid-template-columns:repeat(5,1fr)}nav button{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 2px 10px;color:var(--mut);font-size:11px;font-weight:600}nav button .i{width:22px;height:22px}nav button.on{color:var(--g)}nav button.on::before{content:"";position:absolute;top:0;width:34px;height:3px;border-radius:0 0 4px 4px;background:var(--g)}
.ov{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center}
.sh{width:min(680px,100%);max-height:90vh;overflow:auto;background:var(--bg);border-radius:24px 24px 0 0;padding:16px 16px calc(22px + env(safe-area-inset-bottom));animation:up .22s ease-out}@keyframes up{from{transform:translateY(40px);opacity:0}}
.sh h2{font-size:19px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}.sh h2 button{width:34px;height:34px;border-radius:50%;background:var(--card2)}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:600;z-index:90;max-width:90%;text-align:center;box-shadow:var(--sh);animation:fade .2s}.toast.bad{background:var(--red);color:#fff}
.sk{height:84px;border-radius:18px;background:linear-gradient(90deg,var(--card2),var(--card),var(--card2));background-size:200% 100%;animation:sk 1.2s infinite;margin-bottom:12px}@keyframes sk{to{background-position:-200% 0}}
.empty{text-align:center;color:var(--mut);padding:30px 14px}.empty .i{width:44px;height:44px;opacity:.5;margin-bottom:8px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:12px}.cal b{color:var(--mut);font-weight:600;padding:4px 0}.cal button{aspect-ratio:1;border-radius:10px;background:var(--card2);font-weight:600;position:relative}.cal button.has{background:color-mix(in srgb,var(--g) 22%,transparent);color:var(--g)}.cal button.sel{outline:2px solid var(--g)}.cal button.dim{opacity:.3}
.chart{display:flex;align-items:flex-end;gap:4px;height:110px}.chart div{flex:1;display:flex;align-items:flex-end;gap:2px;height:100%}.chart i{display:block;flex:1;border-radius:4px 4px 0 0;min-height:2px}
.code{background:var(--card2);padding:11px 12px;border-radius:12px;word-break:break-all;font-size:13px;user-select:text}
</style>

<script>
const tg = window.Telegram && Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }
document.documentElement.dataset.theme = tg && tg.colorScheme === 'dark' ? 'dark' : (matchMedia('(prefers-color-scheme: dark)').matches && !tg ? 'dark' : 'light');
const BOT = (new URLSearchParams(location.search).get('b') || 'controller').replace(/[^\w-]/g, ''); const CTL = BOT === 'controller';
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const f2 = (n) => Number(n || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const ico = (n, c = '') => `<svg class="i ${c}"><use href="#i-${n}"/></svg>`;
const ago = (t) => { const s = (Date.now() - new Date(t).getTime()) / 1000; if (s < 60) return 'now'; if (s < 3600) return `${Math.floor(s / 60)}m`; if (s < 86400) return `${Math.floor(s / 3600)}h`; return `${Math.floor(s / 86400)}d`; };
const S = { mode: 'user', tab: 'home', sub: null, seg: {}, home: null, tz: 3, cfg: null, calDay: null };
const haptic = (k) => { try { tg.HapticFeedback.notificationOccurred(k); } catch (_) {} };

async function api(path, method = 'GET', body, raw) {
  const base = CTL ? '/jb/ctl' : `/jb/api/${BOT}`;
  const r = await fetch(base + path, { method, headers: { 'Content-Type': 'application/json', 'X-Init-Data': (tg && tg.initData) || '' }, body: body ? JSON.stringify(body) : undefined });
  if (raw && r.ok) return r.text();
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || 'Something went wrong.');
  return j;
}
function toast(m, bad) { const t = document.createElement('div'); t.className = 'toast' + (bad ? ' bad' : ''); t.textContent = m; document.body.appendChild(t); haptic(bad ? 'error' : 'success'); setTimeout(() => t.remove(), 2800); }
const guard = (fn) => async (...a) => { try { return await fn(...a); } catch (e) { toast(e.message, true); } };
function sheet(title, html) { closeSheet(); const o = document.createElement('div'); o.className = 'ov'; o.id = 'sheet'; o.innerHTML = `<div class="sh"><h2><span>${title}</span><button data-a="close" aria-label="Close">${ico('x')}</button></h2>${html}</div>`; o.addEventListener('click', (e) => { if (e.target === o) closeSheet(); }); $('#host').appendChild(o); return o; }
const closeSheet = () => { const s = $('#sheet'); if (s) s.remove(); };
function ask(title, text, ok = 'Confirm', red) { return new Promise((res) => { const o = sheet(title, `<p class="mut" style="margin-bottom:14px">${text}</p><div class="grid2"><button class="btn ghost" id="n">Cancel</button><button class="btn ${red ? 'red' : ''}" id="y">${ok}</button></div>`); $('#n', o).onclick = () => { closeSheet(); res(false); }; $('#y', o).onclick = () => { closeSheet(); res(true); }; }); }
const openLink = (u) => { if (!u) return; try { if (/^https:\/\/t\.me\//.test(u)) tg.openTelegramLink(u); else tg.openLink(u); } catch (_) { window.open(u, '_blank'); } };
const copy = async (t) => { try { await navigator.clipboard.writeText(t); toast('Copied'); } catch (_) { toast('Press and hold to copy', true); } };
const empty = (ic, t) => `<div class="empty">${ico(ic)}<div>${t}</div></div>`;
const seg = (key, items) => `<div class="seg">${items.map(([k, l]) => `<button data-a="seg" data-k="${key}" data-v="${k}" class="${(S.seg[key] || items[0][0]) === k ? 'on' : ''}">${l}</button>`).join('')}</div>`;
const segv = (key, first) => S.seg[key] || first;

/* ---------------- generic form ---------------- */
function formHtml(fields, v = {}) {
  return fields.map((f) => {
    const val = v[f.k] != null ? v[f.k] : (f.d != null ? f.d : '');
    const id = `f_${f.k}`; const hint = f.h ? `<div class="hint">${f.h}</div>` : '';
    if (f.t === 'toggle') return `<div class="tg"><div><b style="font-size:15px">${f.l}</b>${hint}</div><button class="sw" id="${id}" data-a="tog" aria-pressed="${!!val}"></button></div>`;
    if (f.t === 'select') return `<label>${f.l}</label><select id="${id}">${f.o.map(([k, l]) => `<option value="${esc(k)}" ${String(val) === String(k) ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select>${hint}`;
    if (f.t === 'area') return `<label>${f.l}</label><textarea id="${id}" placeholder="${esc(f.p || '')}">${esc(val)}</textarea>${hint}`;
    if (f.t === 'chips') { const sel = new Set((val || []).map(String)); return `<label>${f.l}</label><div class="chips" id="${id}">${f.o.map(([k, l]) => `<button data-a="chip" data-v="${k}" aria-pressed="${sel.has(String(k))}">${esc(l)}</button>`).join('') || '<span class="mut">Nothing to choose yet.</span>'}</div>${hint}`; }
    const type = f.t === 'dt' ? 'datetime-local' : f.t === 'number' ? 'number' : 'text';

  $('#psave', o).onclick = guard(async () => { const b = formRead(f); if (p) { b.reschedule = true; await api(`/a/posts/${p.id}`, 'PUT', b); } else await api('/a/posts', 'POST', b); closeSheet(); toast('Scheduled'); render(); });
}
async function bcSheet() {
  const f = [{ k: 'text', l: 'Message (HTML allowed)', t: 'area' }, { k: 'media_type', l: 'Media', t: 'select', o: [['none', 'No media'], ['photo', 'Photo'], ['video', 'Video']] }, { k: 'media_url', l: 'Media link (https)', t: 'text' }, { k: 'button_text', l: 'Button text (optional)', t: 'text' }, { k: 'button_url', l: 'Button link', t: 'text' }, { k: 'audience', l: 'Send to', t: 'select', o: [['all', 'Everyone who can be reached'], ['verified', 'Verified users'], ['active', 'Active in the last 7 days'], ['task_doers', 'Users who completed a task']] }, { k: 'run_at', l: `Send at (empty = now)`, t: 'dt' }];
  const o = sheet('New broadcast', `${formHtml(f)}<div class="grid2" style="margin-top:14px"><button class="btn ghost" id="bpre">Preview to me</button><button class="btn" id="bsend">Send</button></div>`);
  const body = () => { const b = formRead(f); if (!b.run_at) delete b.run_at; return b; };
  $('#bpre', o).onclick = guard(async () => { const b = body(); await api('/a/broadcasts/preview', 'POST', b); toast('Preview sent to you'); });
  $('#bsend', o).onclick = guard(async () => {
    let r = await api('/a/broadcasts', 'POST', body());
    if (r.needs_confirm) { const ok = await ask('Send to ' + r.total + ' users?', 'This reaches many people and cannot be undone once started. You can cancel while it runs.', 'Send now'); if (!ok) return; r = await api('/a/broadcasts', 'POST', { ...body(), confirm: true }); }
    closeSheet(); toast('Broadcast queued'); render();
  });
}
async function userSheet(id) {

}

document.addEventListener('click', guard(async (e) => {
  const el = e.target.closest('[data-a]'); if (!el) return; const a = el.dataset.a; const id = el.dataset.id; const v = el.dataset.v;
  const after = async (msg) => { if (msg) toast(msg); closeSheet(); S.cfg = null; await render(); };
  switch (a) {
    case 'close': return closeSheet();
    case 'tab': S.tab = v; S.sub = null; return render();
    case 'mode': S.mode = S.mode === 'admin' ? 'user' : 'admin'; S.tab = S.mode === 'admin' ? 'ov' : 'home'; S.sub = null; if (S.mode === 'admin') await cfg(); return render();
    case 'seg': S.seg[el.dataset.k] = v; return render();
    case 'sub': S.sub = v || null; return render();
    case 'tog': return el.setAttribute('aria-pressed', el.getAttribute('aria-pressed') !== 'true');
    case 'chip': return el.setAttribute('aria-pressed', el.getAttribute('aria-pressed') !== 'true');
    case 'chip1': el.parentElement.querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', 'false')); return el.setAttribute('aria-pressed', 'true');
    case 'copy': return copy(el.dataset.t);
    case 'share': return openLink(`https://t.me/share/url?url=${encodeURIComponent(el.dataset.t)}&text=${encodeURIComponent('Earn ETB rewards with me!')}`);
    case 'open': return openLink(el.dataset.url);
    /* user */
    case 'visit': { await api(`/tasks/${id}/visit`, 'POST'); openLink(el.dataset.url); return toast('Stay on the page a few seconds, then press Verify.'); }
    case 'claim': { const r = await api(`/tasks/${id}/claim`, 'POST'); toast(r.message, !r.ok); await refresh(); return; }
    case 'proof': { const o = sheet('Submit proof', `<textarea id="pf" placeholder="Paste your proof or a link"></textarea><button class="btn" style="margin-top:12px" id="ps">Send for review</button>`); $('#ps', o).onclick = guard(async () => { const r = await api(`/tasks/${id}/claim`, 'POST', { proof: $('#pf').value }); toast(r.message, !r.ok); if (r.ok) { closeSheet(); await refresh(); } }); return; }
    case 'verifyall': { const r = await api('/verify', 'POST'); if (r.earned > 0) toast(`+${f2(r.earned)} ETB`); if (r.problems.length) sheet('Not finished yet', r.problems.map((p) => `<div class="item"><div class="ic">${ico('x')}</div><div><b>${esc(p.task)}</b><small>${esc(p.reason)}</small></div></div>`).join('')); else if (!r.earned) toast('Nothing new to verify.'); await refresh(); return; }
    case 'max': { const u = S.home.user; const s = S.home.settings; let m = Number(u.balance); if (s.max_withdraw > 0) m = Math.min(m, s.max_withdraw); $('#wamt').value = Math.floor(m * 100) / 100; return; }
    case 'withdraw': { const m = $('#wm [aria-pressed=true]'); await api('/withdraw', 'POST', { method: m && m.dataset.v, account: $('#wacc').value, amount: Number($('#wamt').value) }); toast('Request sent'); await refresh(); return; }
    case 'notify': { const on = el.getAttribute('aria-pressed') !== 'true'; el.setAttribute('aria-pressed', on); await api('/me', 'POST', { notify: on }); return; }
    case 'ticket': { await api('/tickets', 'POST', { text: $('#tkt').value }); toast('Sent to support'); return render(); }
    /* admin: money */
    case 'wdset': {
      const s = el.dataset.s;
      if (s === 'paid') { const o = sheet('Mark as paid', `<p class="mut" style="margin-bottom:10px">Only mark paid after the money was really sent.</p><label>Payment reference</label><input id="pr" placeholder="Transaction id"><button class="btn" style="margin-top:12px" id="pg">Mark paid</button>`); $('#pg', o).onclick = guard(async () => { await api(`/a/withdrawals/${id}/status`, 'POST', { status: 'paid', pay_ref: $('#pr').value }); await after('Marked paid'); }); return; }
      if (s === 'rejected') { const o = sheet('Reject withdrawal', `<label>Reason (the user sees it)</label><input id="rn" placeholder="Why?"><button class="btn red" style="margin-top:12px" id="rg">Reject and refund</button>`); $('#rg', o).onclick = guard(async () => { await api(`/a/withdrawals/${id}/status`, 'POST', { status: 'rejected', note: $('#rn').value }); await after('Rejected and refunded'); }); return; }
      await api(`/a/withdrawals/${id}/status`, 'POST', { status: s }); return after('Updated');
    }
    case 'claimrev': await api(`/a/claims/${id}/${v}`, 'POST'); return after(v === 'approve' ? 'Approved' : 'Rejected');
    /* admin: tasks */
    case 'tasknew': return taskSheet(null);
    case 'taskedit': { const d = await api('/a/tasks'); return taskSheet(d.tasks.find((t) => String(t.id) === id)); }
    case 'tasktog': await api(`/a/tasks/${id}`, 'PUT', { status: el.dataset.s }); return after('Updated');
    case 'taskdel': if (await ask('Archive this task?', 'Users will no longer see it. Past rewards stay.', 'Archive', true)) { await api(`/a/tasks/${id}`, 'DELETE'); await after('Archived'); } return;
    case 'chadd': await api('/a/channels', 'POST', { ref: $('#chref').value }); return after('Connected');
    case 'chdel': if (await ask('Remove this channel?', 'Tasks that use it keep working until you archive them.', 'Remove', true)) { await api(`/a/channels/${id}`, 'DELETE'); await after('Removed'); } return;
    case 'campnew': { const f = [{ k: 'name', l: 'Name', t: 'text' }, { k: 'starts_at', l: 'Starts', t: 'dt' }, { k: 'ends_at', l: 'Ends', t: 'dt' }, { k: 'task_bonus_pct', l: 'Task bonus (%)', t: 'number', d: 0 }, { k: 'referral_bonus', l: 'Extra ETB per referral', t: 'number', d: 0 }]; const o = sheet('New campaign', `${formHtml(f)}<button class="btn" style="margin-top:12px" id="cs">Create</button>`); $('#cs', o).onclick = guard(async () => { await api('/a/campaigns', 'POST', formRead(f)); await after('Campaign created'); }); return; }
    case 'campdel': await api(`/a/campaigns/${id}`, 'DELETE'); return after('Ended');
    /* admin: content */
    case 'postnew': return postSheet(null);
    case 'postedit': { const d = await api('/a/posts'); return postSheet(d.posts.find((p) => String(p.id) === id)); }
    case 'postdel': if (await ask('Cancel this post?', 'It will not be published.', 'Cancel post', true)) { await api(`/a/posts/${id}`, 'DELETE'); await after('Cancelled'); } return;
    case 'postnow': if (await ask('Publish now?', 'The post goes to all chosen chats immediately.', 'Publish')) { const r = await api(`/a/posts/${id}/send-now`, 'POST'); await after(`${r.results.filter((x) => x.ok).length}/${r.results.length} sent`); } return;
    case 'postretry': { const r = await api(`/a/posts/${id}/retry`, 'POST'); return after(`${r.results.filter((x) => x.ok).length}/${r.results.length} ok`); }
    case 'posthist': { const d = await api(`/a/posts/${id}/history`); return void sheet('Posting history', d.history.length ? d.history.map((h) => `<div class="item"><div class="ic">${ico(h.status === 'ok' ? 'check' : 'x')}</div><div><b>Chat #${h.channel_id}</b><small>${h.status === 'ok' ? 'Published' : esc(h.error || 'Failed')} · ${ago(h.created_at)}</small></div></div>`).join('') : empty('cal', 'Not published yet.')); }
    case 'calday': S.calDay = v || null; return render();
    case 'calnav': S.calOff = (S.calOff || 0) + Number(v); return render();
    case 'bcnew': return bcSheet();
    case 'bccancel': if (await ask('Cancel this broadcast?', 'Messages already sent stay sent.', 'Cancel it', true)) { await api(`/a/broadcasts/${id}/cancel`, 'POST'); await after('Cancelled'); } return;
    case 'annnew': { const f = [{ k: 'title', l: 'Title', t: 'text' }, { k: 'body', l: 'Text', t: 'area' }, { k: 'pinned', l: 'Pin to the top', t: 'toggle' }]; const o = sheet('New announcement', `${formHtml(f)}<button class="btn" style="margin-top:12px" id="as">Publish</button>`); $('#as', o).onclick = guard(async () => { await api('/a/announcements', 'POST', formRead(f)); await after('Published'); }); return; }
    case 'anndel': await api(`/a/announcements/${id}`, 'DELETE'); return after('Removed');
    /* admin: more */
    case 'usearch': S.uq = $('#uq').value; return render();
    case 'upage': return toast('Use search to find a specific user.');
    case 'user': return userSheet(id);
    case 'uban': await api(`/a/users/${id}/ban`, 'POST', { banned: v === 'true' }); return after('Done');
    case 'ureview': await api(`/a/users/${id}/review`, 'POST', { review: v === 'true' }); return after('Done');
    case 'ureset': await api(`/a/users/${id}/reset-captcha`, 'POST'); return after('Verification reset');
    case 'uadj': {
      const cur = Number(el.dataset.bal || 0);
      const f = [
        { k: 'mode', l: 'What do you want to do?', t: 'select', o: [['add', 'Add money'], ['remove', 'Remove money'], ['set', 'Set the balance to']], h: `Current available balance: ${f2(cur)} ETB` },
        { k: 'amount', l: 'Amount (ETB)', t: 'number' },
        { k: 'reason', l: 'Reason (at least 5 letters, saved in the audit log)', t: 'text' }];
      const o = sheet('Edit balance', `${formHtml(f)}<button class="btn" style="margin-top:12px" id="ad">Apply</button>`);
      $('#ad', o).onclick = guard(async () => {
        const b = formRead(f); const n = Math.abs(Number(b.amount));
        if (b.amount === '' || !Number.isFinite(n)) throw new Error('Enter an amount.');
        const now = Number((await api(`/a/users/${id}`)).user.balance);          // latest balance, then work out the change
        const r2 = (x) => Math.round(x * 100) / 100;
        const delta = r2(b.mode === 'add' ? n : b.mode === 'remove' ? -n : n - now);
        if (delta === 0) { toast('Nothing to change'); return; }
        const target = Math.max(0, r2(now + delta));
        if (!(await ask('Change this balance?', `${f2(now)} → ${f2(target)} ETB`, 'Apply'))) return;
        const r = await api(`/a/users/${id}/adjust`, 'POST', { amount: delta, reason: b.reason });
        await after(`Balance changed by ${r.applied > 0 ? '+' : ''}${f2(r.applied)} ETB`);
      });
      return; }
    case 'savecfg': { const b = { settings: {} }; for (const [, fl] of SET) Object.assign(b.settings, formRead(fl)); Object.assign(b, formRead([{ k: 'name', t: 'text' }, { k: 'description', t: 'area' }, { k: 'status', t: 'select' }])); await api('/a/settings', 'PUT', b); S.cfg = null; await cfg(); return toast('Settings saved'); }
    case 'admadd': await api('/a/admins', 'POST', formRead([{ k: 'tg_id', t: 'text' }, { k: 'role', t: 'select' }])); return after('Saved');
    case 'admdel': if (await ask('Remove this admin?', 'They lose access right away.', 'Remove', true)) { await api(`/a/admins/${id}`, 'DELETE'); await after('Removed'); } return;
    case 'flagset': await api(`/a/flags/${id}`, 'POST', { status: v }); return after('Updated');
    case 'tkreply': { const o = sheet('Reply', `<textarea id="tr" placeholder="Your reply goes to the user in the bot"></textarea><button class="btn" style="margin-top:12px" id="tg2">Send</button>`); $('#tg2', o).onclick = guard(async () => { await api(`/a/tickets/${id}/reply`, 'POST', { text: $('#tr').value }); await after('Sent'); }); return; }
    case 'tkclose': await api(`/a/tickets/${id}/close`, 'POST'); return after('Closed');
    case 'export': { const t = await api(`/a/export/${v}`, 'GET', null, true); const u = URL.createObjectURL(new Blob([t], { type: 'text/csv' })); const l = document.createElement('a'); l.href = u; l.download = `${v}.csv`; l.click(); return toast('Downloaded'); }
    /* controller */
    case 'ctladd': { const r = await api('/bots', 'POST', { token: $('#ctok').value }); toast(`Connected @${r.bot.username}`); return render(); }
    case 'ctladmin': { const f = [{ k: 'tg_id', l: 'Admin Telegram id', t: 'text' }, { k: 'role', l: 'Role', t: 'select', o: ROLES }]; const o = sheet('Set the bot admin', `<p class="hint" style="margin:0 0 8px">The admin will not see you or know who set them up.</p>${formHtml(f)}<button class="btn" style="margin-top:12px" id="cg">Save</button>`); $('#cg', o).onclick = guard(async () => { await api(`/bots/${id}/admins`, 'POST', formRead(f)); await after('Saved'); }); return; }
    case 'ctlstatus': await api(`/bots/${id}/status`, 'POST', { status: v }); return after('Updated');
    case 'ctltoken': { const o = sheet('Replace the token', `<p class="hint" style="margin:0 0 8px">Paste the new token for the same bot.</p><input id="nt" placeholder="123456:ABC..."><button class="btn" style="margin-top:12px" id="nk">Save</button>`); $('#nk', o).onclick = guard(async () => { await api(`/bots/${id}/token`, 'POST', { token: $('#nt').value }); await after('Token replaced'); }); return; }
  }
}));

// Tells the server which phone this is, so several accounts on one phone can be caught.
async function deviceReport() {
  try {
    const rd = () => { try { return localStorage.getItem('jb_did') || ''; } catch (_) { return ''; } };
    const rc = () => (document.cookie.match(/(?:^|; )jb_did=([\w-]{16,64})/) || [])[1] || '';
    let did = rd() || rc();
    if (!/^[\w-]{16,64}$/.test(did)) {
      const a = new Uint8Array(16); crypto.getRandomValues(a);
      did = Array.from(a, (b) => b.toString(16).padStart(2, '0')).join('');
    }
    try { localStorage.setItem('jb_did', did); } catch (_) {}
    try { document.cookie = `jb_did=${did}; max-age=63072000; path=/; SameSite=None; Secure`; } catch (_) {}
    let gpu = '';
    try { const g = document.createElement('canvas').getContext('webgl'); const x = g && g.getExtension('WEBGL_debug_renderer_info'); gpu = x ? g.getParameter(x.UNMASKED_RENDERER_WEBGL) : ''; } catch (_) {}
    const raw = [navigator.userAgent, navigator.platform, screen.width + 'x' + screen.height, screen.colorDepth, window.devicePixelRatio, navigator.hardwareConcurrency || '', navigator.deviceMemory || '', Intl.DateTimeFormat().resolvedOptions().timeZone, (navigator.languages || [navigator.language]).join(','), gpu].join('|');
    const h = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(raw));
    const fp = Array.from(new Uint8Array(h), (b) => b.toString(16).padStart(2, '0')).join('');
    await api('/device', 'POST', { did, fp });
  } catch (_) { /* never block the app because of this */ }
}

(async function init() {
  if (CTL) { S.mode = 'ctl'; S.tab = 'ctl'; return render(); }
  await deviceReport();
  try { S.home = await api('/home'); } catch (e) { $('#hdr').innerHTML = ''; $('#nav').innerHTML = ''; $('#main').innerHTML = `<div class="banner r">${ico('lock')}<div>${esc(e.message)}</div></div>`; return; }
  if (S.home.role) { S.mode = 'admin'; S.tab = 'ov'; try { await cfg(); } catch (_) {} }
  render();
})();
</script>
