<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registration Bonus</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="center">
  <div class="card hero">
    <h1>Registration Bonus</h1>
    <p class="sub">Start a bot below and claim your bonus.</p>

    <div class="stats">
      <div class="stat"><div class="num" id="users">–</div><div class="label">Total users</div></div>
      <div class="stat"><div class="num" id="claimed">–</div><div class="label">Bonuses claimed</div></div>
    </div>

    <div id="bots"></div>
    <a href="admin.html" class="sub" style="display:block;margin-top:20px;font-size:12px;color:var(--faint);text-decoration:none">Admin</a>
  </div>

  <script>
    // Set this to your backend URL
    const API_URL = 'https://gmae-production.up.railway.app';

    fetch(`${API_URL}/api/public`)
      .then((r) => r.json())
      .then((d) => {
        document.getElementById('users').textContent = d.totalUsers;
        document.getElementById('claimed').textContent = d.bonusesClaimed;

        const box = document.getElementById('bots');
        if (!d.bots.length) { box.innerHTML = '<p class="sub">No bots available yet.</p>'; return; }

        box.innerHTML = d.bots.map((b) =>
          `<a class="btn block" target="_blank" href="https://t.me/${b.bot_username}?start=web">
             ${b.name} — ${b.bonus} birr
           </a>`
        ).join('');
      })
      .catch(() => {
        document.getElementById('bots').innerHTML = '<p class="sub">Could not load bots.</p>';
      });
  </script>
</body>
</html>
